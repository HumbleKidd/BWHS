    .brand {

    .pill, .tool {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 0.72rem;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }
    .live { background: #fff1f2; color: #be123c; }
    .dot {

      -webkit-box-orient: vertical;

    .times { text-align: right; font-size: 0.72rem; font-weight: 800; color: var(--ink); }

    .aura {

      filter: blur(16px) saturate(1.15) brightness(0.4);
      transform: scale(1.06);
    }
    .viewport {
      position: relative;
      width: min(100%, 1100px);
      margin: 12px auto;

      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    }
    .viewport iframe {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
      pointer-events: none; background: #000; opacity: 0; z-index: 1;

      position: absolute; inset: 0; z-index: 4;

    .missed {

      paint(spot);
      paintMissed(spot);
      const remain = spot.film.dur - spot.into;
      const joinNext = remain < 8;
      const film = joinNext ? nextFilm(spot) : spot.film;
      const startAt = joinNext ? 0 : Math.min(Math.floor(spot.into), Math.max(0, spot.film.dur - 12));
      const drifted = Math.abs(driftSeconds(spot)) > 4;
      const cooling = nowMs() - lastSeekAt < 20000;
      if (!force && loadedId === film.id && !drifted) {
        if (remain < 50 && !joinNext) {
          const nxt = nextFilm(spot);
          if (nxt && primedId !== nxt.id) {
            primedId = nxt.id;
            warm(back, nxt, 0);
          }
        }
        return;
      }
      if (!force && drifted && cooling && loadedId === film.id) return;
      if (!force && primedId === film.id && startAt < 3 && swapToBack()) {
        $('boot').classList.add('hidden');
        return;
      }
      warm(front, film, startAt);
      loadedId = film.id;
      primedId = 0;
      $('boot').classList.add('hidden');
      clearTimeout(handoff);
      const waitFor = joinNext ? nextFilm(spot).dur : remain;
      handoff = setTimeout(() => { loadedId = 0; loadLive(true); }, Math.max(8000, waitFor * 1000));
    }
    function tick() {
      if ($('clockPill')) $('clockPill').textContent = nowClock();
      if (!playlist.length) return;
      if (dayStamp() !== dayKey) {
        loadedId = 0;
        playlist = buildPlaylist();
        loadLive(true);
        return;
      }
      const spot = liveSpot();
      paint(spot);
      if (spot.film.id !== loadedId || Math.abs(driftSeconds(spot)) > 4) loadLive(false);
    }
    function showChrome() {
      document.body.classList.add('fs-chrome');
      $('viewport').classList.add('fs-chrome');
      clearTimeout(chromeTimer);
      chromeTimer = setTimeout(() => {
        document.body.classList.remove('fs-chrome');
        $('viewport').classList.remove('fs-chrome');
      }, 1600);
    }
    function toggleFs() {
      const vp = $('viewport');
      const active = document.fullscreenElement || document.webkitFullscreenElement;
      if (active) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        return;
      }
      (vp.requestFullscreen || vp.webkitRequestFullscreen).call(vp);
      showChrome();
    }
    async function boot() {
      wipeOldSchedules();
      playlist = buildPlaylist();
      loadLive(true);
      await syncClock();
      if (dayStamp() !== dayKey) playlist = buildPlaylist();
      loadedId = 0;
      loadLive(true);
      if (clockLocked && $('clockPill')) $('clockPill').title = 'Channel clock locked across devices';
    }

    armPlayers();
    setInterval(tick, 1000);
    keepScreenAwake();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepScreenAwake(); if (playlist.length) loadLive(true); } });
    window.addEventListener('pageshow', () => { keepScreenAwake(); if (playlist.length) loadLive(true); });
    window.addEventListener('focus', keepScreenAwake);
    boot();
  </script>
</body>
