    .viewport {

    .reload-live {

      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 0 0 auto;
      margin-left: auto;
      border: 0;
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(15, 23, 42, 0.72);
      color: #fff;
      opacity: 0.82;
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1;

    .reload-live:hover, .reload-live:focus-visible { opacity: 1; outline: none; }
    @media (max-width: 900px) {
      .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .go-home { position: static; left: auto; top: auto; transform: none; margin: 0 auto; flex: 1 0 100%; text-align: center; width: fit-content; }
      .brand, .tools { position: relative; z-index: 1; }
      .tools { flex: 1 1 100%; flex-wrap: wrap; justify-content: flex-start; }
      .pill, .tool { flex: 0 1 auto; }
      .reload-live { padding: 6px 9px; opacity: 0.88; }
    }
    .note { flex-shrink: 0; font-size: 0.7rem; font-weight: 700; color: var(--muted); padding: 0 6px 4px; }
    @media (max-width: 900px) {
      .rail { grid-template-columns: 1fr 1fr; }
      .missed { border-radius: 22px; }

    }
    @media (max-width: 760px) {
      .hide-sm { display: none; }
      .now { grid-template-columns: 40px 1fr; }
      .times { display: none; }
      .stage { padding: 8px; gap: 8px; }
      .viewport { margin: 8px; width: auto; }
    }
  </style>
</head>
<body>
  <div class="stage">

  <script>
    const TMDB = 'https://api.themoviedb.org/3';
    const KEY = '129637a8869a61522af21b80f6eb5129';
    const IMG = 'https://image.tmdb.org/t/p/w342';
    const BACK = 'https://image.tmdb.org/t/p/w780';
    const SHIFT = 5 * 3600 * 1000;
    const HOME = 'https://bwhs.online';
    const GENRES = [
      { id: 28, name: 'Action' }, { id: 12, name: 'Adventure' }, { id: 16, name: 'Animation' },
      { id: 35, name: 'Comedy' }, { id: 80, name: 'Crime' }, { id: 18, name: 'Drama' },
      { id: 14, name: 'Fantasy' }, { id: 27, name: 'Horror' }, { id: 9648, name: 'Mystery' },
      { id: 10749, name: 'Romance' }, { id: 878, name: 'Science Fiction' }, { id: 53, name: 'Thriller' },
      { id: 10752, name: 'War' }, { id: 37, name: 'Western' }
    ];
    const FALLBACK = {
      28: [155,603,27205,245891,76341,299536], 12: [122,120,671,329,122917,11],
      16: [129,585,10681,12477,12,808], 35: [13,773,18785,120467,546554,49519],
      80: [769,111,680,807,103,1422], 18: [278,238,424,550,389,73],
      14: [671,122,120,121,122917,76338], 27: [694,948,539,9552,419430,493922],
      9648: [745,807,77,11324,146,1949], 10749: [11036,597,4348,313369,152601,332562],
      878: [603,27205,157336,78,62,335984], 53: [550,680,745,807,694,146233],
      10752: [857,424,600,228150,374720,1271], 37: [68718,5176,33,11969,9360,336]
    };
    const $ = id => document.getElementById(id);
    let playlist = [], genre = GENRES[0], dayKey = '', loadedId = 0, handoff = null, chromeTimer = null, lastTap = 0;

    function jam() { return new Date(Date.now() - SHIFT); }
    function dayStamp() { return jam().toISOString().slice(0, 10); }
    function secondsIntoDay() {
      const j = jam();
      return j.getUTCHours() * 3600 + j.getUTCMinutes() * 60 + j.getUTCSeconds() + j.getUTCMilliseconds() / 1000;
    }
    function hash(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
      return h >>> 0;
    }
    function mulberry32(a) {
      return function() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    function shuffle(list, seed) {
      const rand = mulberry32(seed), arr = list.slice();
      for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
      return arr;
    }
    function pad(n) { return String(n).padStart(2, '0'); }
    function clock12(totalSec) {
      const s = ((Math.floor(totalSec) % 86400) + 86400) % 86400;
      let h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
      const ap = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return h + ':' + pad(m) + ' ' + ap;
    }
    function nowClock() {
      const j = jam();
      return clock12(j.getUTCHours() * 3600 + j.getUTCMinutes() * 60 + j.getUTCSeconds());
    }
    function prettyDate(iso) {
      if (!iso) return '';
      const d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
    function shortSyn(text) {
      const clean = (text || '').replace(/\s+/g, ' ').trim();
      if (clean.length <= 140) return clean;
      return clean.slice(0, 137).replace(/\s+\S*$/, '') + '…';
    }
    async function getJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('tmdb');
      return res.json();
    }
    async function hydrate(id) {
      try {
        const d = await getJSON(`${TMDB}/movie/${id}?api_key=${KEY}&language=en-US`);
        const runtime = Number(d.runtime) || 0;
        if (runtime < 75 || runtime > 210 || d.adult || !d.title) return null;
        return {
          id: d.id, title: d.title, year: (d.release_date || '').slice(0, 4),
          date: d.release_date || '', runtime, overview: d.overview || '',
          poster: d.poster_path ? IMG + d.poster_path : '',
          backdrop: d.backdrop_path ? BACK + d.backdrop_path : ''
        };
      } catch (_) { return null; }
    }
    async function buildPlaylist() {
      dayKey = dayStamp();
      genre = GENRES[hash(dayKey) % GENRES.length];
      $('genrePill').textContent = genre.name;
      const cacheKey = 'bwhs24v4:' + dayKey;
      try {
        const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
        if (cached && cached.length >= 8) return cached;
      } catch (_) {}
      const lte = new Date(Date.now() - 50 * 86400000).toISOString().slice(0, 10);
      const page = (hash(dayKey + ':p') % 2) + 1;
      let results = [];
      try {
        const data = await getJSON(`${TMDB}/discover/movie?api_key=${KEY}&include_adult=false&include_video=false&without_genres=10770&with_genres=${genre.id}&with_original_language=en&sort_by=vote_count.desc&vote_count.gte=900&vote_average.gte=6.2&primary_release_date.lte=${lte}&page=${page}`);
        results = data.results || [];
      } catch (_) {}
      const ids = [];
      shuffle(results, hash(dayKey + ':' + genre.id)).forEach(m => { if (m && m.id && !ids.includes(m.id)) ids.push(m.id); });
      (FALLBACK[genre.id] || []).forEach(id => { if (!ids.includes(id)) ids.push(id); });
      const picked = [];
      for (let i = 0; i < ids.length && picked.length < 14; i += 4) {
        const rows = await Promise.all(ids.slice(i, i + 4).map(hydrate));
        rows.forEach(row => { if (row) picked.push(row); });
      }
      const ordered = shuffle(picked, hash('reel:' + dayKey));
      let cursor = 0;
      const reel = [];
      while (ordered.length && cursor < 26 * 3600 && reel.length < 36) {
        const film = ordered[reel.length % ordered.length];
        const dur = film.runtime * 60;
        reel.push({ ...film, start: cursor, dur });
        cursor += dur;
        if (reel.length >= ordered.length && cursor >= 24 * 3600) break;
      }
      try { localStorage.setItem(cacheKey, JSON.stringify(reel)); } catch (_) {}
      return reel;
    }
    function liveSpot() {
      const t = secondsIntoDay();
      const total = playlist.reduce((n, f) => n + f.dur, 0) || 1;
      const pos = t % total;
      let film = playlist[0];
      for (const item of playlist) {
        if (pos >= item.start && pos < item.start + item.dur) { film = item; break; }
      }
      return { film, into: Math.max(0, pos - film.start), pos };
    }
    function vixUrl(id, startAt) {
      return `https://vixsrc.to/movie/${id}?autoplay=1&autoPlay=true&muted=0&lang=en&primaryColor=4f46e5&secondaryColor=0f172a&skin=vixsrc&canPlayFHD=1&quality=1080&startAt=${Math.max(0, Math.floor(startAt || 0))}`;
    }
    function paint(spot) {
      const film = spot.film;
      $('nowKicker').textContent = 'Now playing';
      $('nowTitle').textContent = film.title;
      document.title = film.title + ' · 24/7 PLAY';
      $('nowSub').textContent = [film.year, prettyDate(film.date)].filter(Boolean).join(' · ');
      $('nowSyn').textContent = shortSyn(film.overview);
      if (film.poster) $('nowPoster').src = film.poster;
      if (film.backdrop) $('aura').style.backgroundImage = `url("${film.backdrop}")`;
      $('progressBar').style.width = Math.min(100, (spot.into / film.dur) * 100).toFixed(2) + '%';
      $('startLabel').textContent = 'Started ' + clock12(film.start);
      $('endLabel').textContent = 'Ends ' + clock12(film.start + film.dur);
      $('clockPill').textContent = nowClock();
    }
    function paintMissed(spot) {
      const missed = playlist.filter(f => f.start + f.dur <= spot.film.start + 1).slice(-6);
      const rail = $('missedRail');
      rail.innerHTML = '';
      $('missedHint').textContent = missed.length ? ('You just missed ' + missed[missed.length - 1].title) : 'The first film of the day is still on';
      missed.forEach(film => {
        const a = document.createElement('a');
        a.className = 'miss-card';
        a.href = HOME + '/#/watch/movie/' + film.id;
        a.target = '_blank';
        a.rel = 'noopener';
        a.innerHTML = `<img alt="" src="${film.poster || ''}" /><div><strong>${film.title}</strong><em>Ended ${clock12(film.start + film.dur)}</em></div>`;
        rail.appendChild(a);
      });
      rail.scrollLeft = rail.scrollWidth;
    }
    let front = null, back = null, primedId = 0, priming = false;
    function armPlayers() {
      front = $('player');
      back = $('playerB');
      [front, back].forEach(frame => {
        frame.addEventListener('load', () => {
          if (!frame.src || frame.src === 'about:blank') return;
          frame.dataset.ready = '1';
          if (frame === front) $('boot').classList.add('hidden');
          if (frame === back && primedId && primedId === liveSpot().film.id) swapToBack();
        });
      });
    }
    function nextFilm(spot) {
      const i = Math.max(0, playlist.findIndex(f => f.id === spot.film.id));
      return playlist[(i + 1) % playlist.length];
    }
    function warm(frame, film, startAt) {
      const url = vixUrl(film.id, startAt);
      if (frame.dataset.url === url) return;
      frame.dataset.ready = '';
      frame.dataset.url = url;
      frame.src = url;
    }
    function swapToBack() {
      if (!back || back.dataset.ready !== '1') return false;
      back.classList.add('front');
      front.classList.remove('front');
      const old = front;
      front = back;
      back = old;
      loadedId = primedId || loadedId;
      primedId = 0;
      priming = false;
      setTimeout(() => {
        back.classList.remove('front');
        back.dataset.ready = '';
        back.dataset.url = '';
        back.src = 'about:blank';
      }, 700);
      return true;
    }
    function remember(film, startAt) {
      try { sessionStorage.setItem('bwhs247-live', JSON.stringify({ id: film.id, title: film.title, startAt, saved: Date.now() })); } catch (_) {}
    }
    function restoreInstant() {
      try {
        const saved = JSON.parse(sessionStorage.getItem('bwhs247-live') || 'null');
        if (!saved || !saved.id) return;
        const elapsed = Math.max(0, Math.floor((Date.now() - (saved.saved || Date.now())) / 1000));
        const startAt = (saved.startAt || 0) + elapsed;
        warm($('player'), {id: saved.id}, startAt);
        $('nowTitle').textContent = saved.title || 'Back on air';
        $('boot').classList.add('hidden');
        loadedId = saved.id;
      } catch (_) {}
    }
    function loadLive() {
      if (!playlist.length || !front) return;
      const spot = liveSpot();
      paint(spot);
      paintMissed(spot);
      const startAt = Math.min(Math.floor(spot.into), Math.max(0, spot.film.dur - 12));
      const remain = spot.film.dur - spot.into;
      if (loadedId === spot.film.id) {
        remember(spot.film, startAt);
        if (remain < 45) {
          const nxt = nextFilm(spot);
          if (nxt && primedId !== nxt.id) {
            primedId = nxt.id;
            priming = true;
            warm(back, nxt, 0);
          }
        }
        return;
      }
      if (primedId === spot.film.id && swapToBack()) {
        remember(spot.film, startAt);
        $('boot').classList.add('hidden');
        return;
      }
      warm(front, spot.film, startAt);
      loadedId = spot.film.id;
      remember(spot.film, startAt);
      $('boot').classList.add('hidden');
      clearTimeout(handoff);
      handoff = setTimeout(() => { loadedId = 0; loadLive(); }, Math.max(8000, remain * 1000));
    }
    function tick() {
      $('clockPill').textContent = nowClock();
      if (!playlist.length) return;
      if (dayStamp() !== dayKey) { loadedId = 0; boot(); return; }
      const spot = liveSpot();
      paint(spot);
      if (spot.film.id !== loadedId) loadLive();
    }
    function showChrome() {
      document.body.classList.add('fs-chrome');
      $('viewport').classList.add('fs-chrome');
      clearTimeout(chromeTimer);
      chromeTimer = setTimeout(() => {
        document.body.classList.remove('fs-chrome');
        $('viewport').classList.remove('fs-chrome');
      }, 1600);
    }
    function toggleFs() {
      const vp = $('viewport');
      const active = document.fullscreenElement || document.webkitFullscreenElement;
      if (active) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        return;
      }
      (vp.requestFullscreen || vp.webkitRequestFullscreen).call(vp);
      showChrome();
    }
    async function boot() {
      const rescue = setTimeout(() => {
        if (loadedId || playlist.length) return;
        playlist = [{ id: 155, title: 'The Dark Knight', year: '2008', date: '2008-07-16', runtime: 152, overview: 'Batman raises the stakes in his war on crime.', poster: 'https://image.tmdb.org/t/p/w342/qJ2tW6WMUDux911r6m7haRef0WH.jpg', backdrop: '', start: 0, dur: 152 * 60 }];
        loadLive(true);
      }, 8000);
      try {
        playlist = await buildPlaylist();
      } catch (_) {}
      clearTimeout(rescue);
      if (!playlist.length) {
        playlist = [{ id: 155, title: 'The Dark Knight', year: '2008', date: '2008-07-16', runtime: 152, overview: 'Batman raises the stakes in his war on crime.', poster: 'https://image.tmdb.org/t/p/w342/qJ2tW6WMUDux911r6m7haRef0WH.jpg', backdrop: '', start: 0, dur: 152 * 60 }];
      }
      loadLive(true);
    }
    $('fsBtn').addEventListener('click', toggleFs);
    $('reloadLive').addEventListener('click', () => location.reload());
    $('fsExit').addEventListener('click', toggleFs);
    $('shield').addEventListener('click', () => {
      const now = Date.now();
      if (now - lastTap < 320) toggleFs();
      lastTap = now;
      showChrome();
    });
    $('viewport').addEventListener('mousemove', showChrome);
    document.addEventListener('keydown', (e) => {
      if (['ArrowLeft','ArrowRight',' ','MediaTrackNext','MediaTrackPrevious'].includes(e.key)) e.preventDefault();
      if (e.key === 'f' || e.key === 'F') toggleFs();
      showChrome();
    });
    document.addEventListener('fullscreenchange', showChrome);

    let screenWakeLock = null;
    let wakeWanted = true;
    async function keepScreenAwake() {
      wakeWanted = true;
      try {
        if (!navigator.wakeLock || !navigator.wakeLock.request) return;
        if (screenWakeLock && !screenWakeLock.released) return;
        screenWakeLock = await navigator.wakeLock.request("screen");
        screenWakeLock.addEventListener("release", () => {
          screenWakeLock = null;
          if (wakeWanted && document.visibilityState === "visible") setTimeout(keepScreenAwake, 400);
        });
      } catch (_) {}
    }
    armPlayers();
    setInterval(tick, 1000);
    keepScreenAwake();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepScreenAwake(); if (playlist.length) loadLive(true); } });
    window.addEventListener('pageshow', () => { keepScreenAwake(); if (playlist.length) loadLive(true); });
    window.addEventListener('focus', keepScreenAwake);
    boot();
  </script>
</body>
