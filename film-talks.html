<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Film Talks — BWHS</title>
<meta name="description" content="Film Talks is the BWHS community room. Chat about movies and shows, then jump to Watch or Trailer." />
<link rel="icon" href="./favicon-32x32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<style>
  :root {
    --ink:#142033; --muted:#6b728d; --line:#e7eaf6; --card:#fff;
    --bg:#f3f5ff; --indigo:#4f46e5; --pink:#ec4899; --amber:#f59e0b;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; color:var(--ink);
    font-family:"Plus Jakarta Sans",system-ui,sans-serif;
    background:
      radial-gradient(700px 360px at 0% 0%, #e0e7ff 0%, transparent 60%),
      radial-gradient(640px 340px at 100% 0%, #fce7f3 0%, transparent 55%),
      var(--bg);
  }
  button, input, textarea { font:inherit; }
  a { color:inherit; text-decoration:none; }
  .app { width:min(1180px, calc(100% - 18px)); margin:12px auto; display:grid; grid-template-columns:230px 1fr 250px; gap:12px; min-height:calc(100vh - 24px); }
  .panel { background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:24px; box-shadow:0 16px 40px rgba(79,70,229,.07); }
  .side, .rail { padding:14px; }
  .brand { display:flex; gap:10px; align-items:center; margin-bottom:16px; }
  .mark { width:42px; height:42px; border-radius:14px; display:grid; place-items:center; color:#fff; background:linear-gradient(145deg,#818cf8,#4f46e5 55%,#ec4899); }
  h1 { margin:0; font-size:1.05rem; letter-spacing:-.03em; }
  .sub { margin:2px 0 0; color:var(--muted); font-size:.72rem; font-weight:700; }
  .chan { width:100%; display:flex; align-items:center; gap:8px; border:0; background:transparent; border-radius:12px; padding:10px; font-weight:800; color:var(--muted); cursor:pointer; text-align:left; }
  .chan.on, .chan:hover { background:#eef2ff; color:var(--indigo); }
  .back { display:flex; margin-top:16px; padding:10px; border-radius:12px; background:#fff7ed; color:#c2410c; font-weight:800; font-size:.82rem; }
  .room { display:flex; flex-direction:column; min-height:calc(100vh - 24px); overflow:hidden; }
  .bar { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); }
  .live { display:flex; align-items:center; gap:8px; font-weight:800; }
  .dot { width:8px; height:8px; border-radius:50%; background:#10b981; box-shadow:0 0 0 0 rgba(16,185,129,.55); animation:pulse 1.8s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 8px rgba(16,185,129,0);} }
  .tools { display:flex; gap:8px; }
  .tools select, .tools button { border:1px solid var(--line); background:#f8fafc; border-radius:999px; padding:7px 10px; font-weight:800; font-size:.75rem; }
  .stream { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:10px; background:linear-gradient(#f8f9ff,#fff); }
  .day { text-align:center; color:var(--muted); font-size:.72rem; font-weight:800; }
  .msg { display:grid; grid-template-columns:46px 1fr; gap:10px; }
  .msg img.av { width:46px; height:46px; border-radius:16px; background:#eef2ff; }
  .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:10px 12px; box-shadow:0 8px 18px rgba(15,23,42,.04); }
  .meta { display:flex; justify-content:space-between; gap:8px; }
  .meta b { font-size:.92rem; }
  .meta time { color:var(--muted); font-size:.74rem; font-weight:700; }
  .say { margin:6px 0 8px; font-weight:600; line-height:1.45; white-space:pre-wrap; word-break:break-word; }
  .film {
    width:100%; display:flex; gap:8px; align-items:center; text-align:left; border:0; cursor:pointer;
    background:#f5f3ff; border-radius:14px; padding:6px; margin-bottom:8px;
  }
  .film img { width:34px; height:48px; object-fit:cover; border-radius:8px; background:#e0e7ff; }
  .film b { display:block; font-size:.84rem; }
  .film span { color:var(--indigo); font-size:.72rem; font-weight:800; }
  .love { border:0; background:#fff1f2; color:#e11d48; border-radius:999px; padding:5px 10px; font-weight:800; cursor:pointer; }
  .love.on { background:#e11d48; color:#fff; }
  .empty { margin:auto; text-align:center; color:var(--muted); font-weight:700; max-width:320px; }
  .composer { border-top:1px solid var(--line); padding:12px; background:#fff; }
  .row { display:flex; gap:8px; }
  input, textarea { width:100%; border:1.5px solid var(--line); background:#f8fafc; border-radius:14px; padding:11px 12px; outline:none; font-weight:650; }
  input:focus, textarea:focus { border-color:#c7d2fe; background:#fff; box-shadow:0 0 0 4px rgba(79,70,229,.1); }
  textarea { min-height:68px; margin-top:8px; resize:vertical; }
  .pick { position:relative; flex:1; }
  .suggest { position:absolute; left:0; right:0; bottom:calc(100% + 6px); background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 16px 36px rgba(15,23,42,.12); display:none; max-height:260px; overflow:auto; z-index:4; }
  .suggest.open { display:block; }
  .sug { width:100%; display:flex; gap:8px; align-items:center; border:0; background:#fff; padding:8px; cursor:pointer; text-align:left; border-bottom:1px solid var(--line); }
  .sug img { width:32px; height:46px; object-fit:cover; border-radius:7px; }
  .sug b { display:block; font-size:.82rem; }
  .sug span { color:var(--muted); font-size:.7rem; font-weight:700; }
  .picked { display:none; align-items:center; gap:8px; margin-top:8px; background:#eef2ff; border-radius:12px; padding:6px 8px; font-size:.82rem; font-weight:800; }
  .picked.show { display:flex; }
  .picked img { width:26px; height:36px; object-fit:cover; border-radius:6px; }
  .picked button { margin-left:auto; border:0; background:transparent; cursor:pointer; }
  .sendrow { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .hint { color:var(--muted); font-size:.74rem; font-weight:700; }
  .send { border:0; color:#fff; font-weight:800; border-radius:14px; padding:11px 16px; cursor:pointer; background:linear-gradient(135deg,#6366f1,#4f46e5 50%,#ec4899); }
  .send:disabled { opacity:.55; }
  .who { display:flex; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .who img { width:32px; height:32px; border-radius:10px; }
  .who b { display:block; font-size:.8rem; }
  .who span { color:var(--muted); font-size:.68rem; font-weight:700; }
  .menu { position:fixed; z-index:20; display:none; min-width:180px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:8px; box-shadow:0 18px 40px rgba(15,23,42,.16); }
  .menu.open { display:grid; gap:6px; }
  .menu a, .menu button { border:0; border-radius:12px; padding:10px; font-weight:800; cursor:pointer; background:#f8fafc; text-align:left; }
  .menu .watch { background:var(--indigo); color:#fff; }
  .toast { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); background:#142033; color:#fff; padding:10px 14px; border-radius:12px; opacity:0; font-weight:700; transition:.2s; }
  .toast.show { opacity:1; }
  .honeypot { position:absolute; left:-9999px; }
  @media (max-width:900px) {
    .app { grid-template-columns:1fr; }
    .rail { display:none; }
    .side { display:flex; gap:8px; overflow:auto; align-items:center; }
    .brand, .back { display:none; }
    .chan { width:auto; white-space:nowrap; }
    .room { min-height:calc(100vh - 120px); }
  }
</style>
</head>
<body>
  <div class="app">
    <aside class="panel side">
      <div class="brand">
        <div class="mark"><i class="fa-solid fa-comments"></i></div>
        <div><h1>Film Talks</h1><p class="sub">BWHS community</p></div>
      </div>
      <button class="chan on" data-chan="all"><i class="fa-solid fa-hashtag"></i> All talks</button>
      <button class="chan" data-chan="movie"><i class="fa-solid fa-film"></i> Movies</button>
      <button class="chan" data-chan="tv"><i class="fa-solid fa-tv"></i> Series</button>
      <button class="chan" data-chan="chat"><i class="fa-solid fa-message"></i> Just chatting</button>
      <a class="back" href="./index.html"><i class="fa-solid fa-arrow-left"></i> Back to BWHS</a>
    </aside>
    <main class="panel room">
      <div class="bar">
        <div class="live"><span class="dot"></span><span id="status">Opening the room…</span></div>
        <div class="tools">
          <select id="sort"><option value="new">Latest</option><option value="old">Oldest</option><option value="top">Most loved</option></select>
          <button id="refresh" type="button">Refresh</button>
        </div>
      </div>
      <div class="stream" id="stream"></div>
      <form class="composer" id="form">
        <div class="row">
          <input id="name" maxlength="40" placeholder="Your name" required />
          <div class="pick">
            <input id="film" maxlength="80" placeholder="Add a film or show, optional" autocomplete="off" />
            <div class="suggest" id="suggest"></div>
          </div>
        </div>
        <div class="picked" id="picked"></div>
        <textarea id="message" maxlength="500" placeholder="Say something to the room…" required></textarea>
        <input class="honeypot" id="company" tabindex="-1" autocomplete="off" />
        <div class="sendrow">
          <span class="hint"><span id="chars">0</span>/500 · film optional · tap a title for Watch or Trailer</span>
          <button class="send" id="send" type="submit">Send</button>
        </div>
      </form>
    </main>
    <aside class="panel rail">
      <b>In the room</b>
      <div id="people" style="margin-top:8px"></div>
    </aside>
  </div>
  <div class="menu" id="menu"></div>
  <div class="toast" id="toast"></div>
<script>
const CONFIG = { url:"https://kvgrrbfmsjuclppgbuut.supabase.co", key:"sb_publishable_hK-Pm71rWpAeWz5_BZpqqw_qAUW34qw" };
const TMDB = "129637a8869a61522af21b80f6eb5129";
const state = { notes:[], liked:JSON.parse(localStorage.getItem("ft-liked")||"{}"), pick:null, lastPost:0, chan:"all" };
const $ = (id) => document.getElementById(id);
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),2400); }
function esc(s){ return String(s||"").replace(/[&<>"']/g,c=>({"&":"&","<":"<",">":">","\"":""","'":"&#39;"}[c])); }
function ago(iso){ const s=Math.max(1,(Date.now()-new Date(iso))/1000); if(s<60)return"just now"; if(s<3600)return Math.floor(s/60)+"m"; if(s<86400)return Math.floor(s/3600)+"h"; return Math.floor(s/86400)+"d"; }
function poster(p){ return p ? "https://image.tmdb.org/t/p/w185"+p : "https://api.dicebear.com/9.x/shapes/svg?seed=film"; }
function parseNote(row){
  const raw=String(row.message||"");
  if(raw.startsWith("@@ft@@")){ try { const d=JSON.parse(raw.slice(6)); return {...row, text:d.text||"", title:d.title||"", type:d.type||"movie", tmdb:d.tmdb||null, poster:d.poster||"", year:d.year||""}; } catch(e){} }
  if(raw.startsWith("🎬 ")){ const [h,...r]=raw.split("\n"); return {...row, title:h.slice(2), text:r.join("\n"), type:"movie", tmdb:null, poster:"", year:""}; }
  return {...row, text:raw, title:"", type:"chat", tmdb:null, poster:"", year:""};
}
function watchHref(n){ if(!n.tmdb) return "./index.html"; return n.type==="tv" ? `./index.html#/watch/tv/${n.tmdb}/1/1` : `./index.html#/watch/movie/${n.tmdb}`; }
async function load(){
  const res = await fetch(CONFIG.url+"/rest/v1/wall_notes?select=id,name,message,hearts,created_at&order=created_at.desc&limit=200", { headers:{ apikey:CONFIG.key, Authorization:"Bearer "+CONFIG.key } });
  if(!res.ok){ $("status").textContent="Room offline"; toast("Could not load chats"); return; }
  state.notes = (await res.json()).map(parseNote);
  const loves = state.notes.reduce((s,n)=>s+(n.hearts||0),0);
  $("status").textContent = state.notes.length+" chats · "+loves+" loves";
  const names = [...new Set(state.notes.map(n=>n.name))].slice(0,8);
  $("people").innerHTML = names.map(n=>`<div class="who"><img alt="" src="https://api.dicebear.com/9.x/notionists-neutral/svg?seed=${encodeURIComponent(n)}" /><div><b>${esc(n)}</b><span>posted in here</span></div></div>`).join("") || "<p class='hint'>No one yet. Be first.</p>";
  render();
}
function render(){
  const sort=$("sort").value;
  let list=state.notes.filter(n=>{
    if(state.chan==="all") return true;
    if(state.chan==="chat") return !n.tmdb && !n.title;
    return n.type===state.chan;
  });
  if(sort==="old") list.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  if(sort==="top") list.sort((a,b)=>(b.hearts||0)-(a.hearts||0));
  if(sort==="new") list.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const stream=$("stream");
  if(!list.length){ stream.innerHTML='<div class="empty"><i class="fa-solid fa-comments" style="color:#4f46e5;font-size:28px"></i><p>This room is empty. Drop the first chat below.</p></div>'; return; }
  stream.innerHTML = `<div class="day">Today in Film Talks</div>` + list.map(n=>`
    <article class="msg">
      <img class="av" alt="" src="https://api.dicebear.com/9.x/notionists-neutral/svg?seed=${encodeURIComponent(n.name)}" />
      <div class="card">
        <div class="meta"><b>${esc(n.name)}</b><time>${ago(n.created_at)}</time></div>
        ${n.title ? `<button class="film" data-open="${n.id}"><img alt="" src="${poster(n.poster)}" /><div><b>${esc(n.title)}</b><span>${n.year||""} ${n.type==="tv"?"Series":"Movie"} · Watch or Trailer</span></div></button>` : ""}
        <p class="say">${esc(n.text)}</p>
        <button class="love ${state.liked[n.id]?"on":""}" data-love="${n.id}"><i class="fa-solid fa-heart"></i> ${n.hearts||0}</button>
      </div>
    </article>`).join("");
}
document.querySelectorAll(".chan").forEach(btn=>btn.onclick=()=>{ document.querySelectorAll(".chan").forEach(b=>b.classList.remove("on")); btn.classList.add("on"); state.chan=btn.dataset.chan; render(); });
function closeMenu(){ $("menu").classList.remove("open"); }
async function openTrailer(n){
  closeMenu();
  if(!n.tmdb){ toast("No trailer on this chat."); return; }
  const res = await fetch(`https://api.themoviedb.org/3/${n.type}/${n.tmdb}/videos?api_key=${TMDB}`);
  const data = await res.json();
  const clip=(data.results||[]).find(v=>v.site==="YouTube"&&v.type==="Trailer")||(data.results||[]).find(v=>v.site==="YouTube");
  if(!clip){ toast("No trailer yet."); return; }
  window.open("https://www.youtube.com/watch?v="+clip.key,"_blank","noopener");
}
$("stream").onclick=async(e)=>{
  const open=e.target.closest("[data-open]");
  const love=e.target.closest("[data-love]");
  if(open){
    const n=state.notes.find(x=>x.id===open.dataset.open);
    const menu=$("menu");
    menu.innerHTML=`<a class="watch" href="${watchHref(n)}"><i class="fa-solid fa-play"></i> Watch</a><button id="trailerBtn" type="button"><i class="fa-brands fa-youtube"></i> Trailer</button>`;
    menu.style.left=Math.min(e.clientX, innerWidth-200)+"px";
    menu.style.top=Math.min(e.clientY, innerHeight-120)+"px";
    menu.classList.add("open");
    $("trailerBtn").onclick=()=>openTrailer(n);
  }
  if(love){
    const id=love.dataset.love;
    if(state.liked[id]){ toast("Already loved."); return; }
    const n=state.notes.find(x=>x.id===id);
    const res=await fetch(CONFIG.url+"/rest/v1/wall_notes?id=eq."+id,{ method:"PATCH", headers:{ apikey:CONFIG.key, Authorization:"Bearer "+CONFIG.key, "Content-Type":"application/json", Prefer:"return=minimal" }, body:JSON.stringify({ hearts:(n?.hearts||0)+1 }) });
    if(!res.ok){ toast("Love did not save."); return; }
    state.liked[id]=true; localStorage.setItem("ft-liked", JSON.stringify(state.liked)); load();
  }
};
document.addEventListener("click", e=>{ if(!e.target.closest("#menu")&&!e.target.closest("[data-open]")) closeMenu(); if(!e.target.closest("#suggest")&&!e.target.closest("#film")) $("suggest").classList.remove("open"); });
let timer=0;
$("film").addEventListener("input", ()=>{ state.pick=null; $("picked").className="picked"; clearTimeout(timer); timer=setTimeout(search, 220); });
async function search(){
  const q=$("film").value.trim();
  if(q.length<2){ $("suggest").classList.remove("open"); return; }
  const res=await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB}&query=${encodeURIComponent(q)}&include_adult=false`);
  const hits=((await res.json()).results||[]).filter(r=>r.media_type==="movie"||r.media_type==="tv").slice(0,6);
  if(!hits.length){ $("suggest").classList.remove("open"); return; }
  $("suggest")._hits=hits;
  $("suggest").innerHTML=hits.map((r,i)=>`<button type="button" class="sug" data-i="${i}"><img alt="" src="${poster(r.poster_path)}" /><div><b>${esc(r.title||r.name)}</b><span>${r.media_type==="tv"?"Series":"Movie"} · ${(r.release_date||r.first_air_date||"").slice(0,4)}</span></div></button>`).join("");
  $("suggest").classList.add("open");
}
$("suggest").onclick=e=>{
  const b=e.target.closest(".sug"); if(!b) return;
  const hit=$("suggest")._hits[Number(b.dataset.i)];
  state.pick={ tmdb:hit.id, type:hit.media_type, title:hit.title||hit.name, year:(hit.release_date||hit.first_air_date||"").slice(0,4), poster:hit.poster_path||"" };
  $("film").value=state.pick.title; $("suggest").classList.remove("open");
  $("picked").className="picked show";
  $("picked").innerHTML=`<img alt="" src="${poster(state.pick.poster)}" /> ${esc(state.pick.title)} <button type="button" id="clearPick">Remove</button>`;
  $("clearPick").onclick=()=>{ state.pick=null; $("picked").className="picked"; $("film").value=""; };
};
$("message").oninput=()=>{ $("chars").textContent=$("message").value.length; };
$("sort").onchange=render; $("refresh").onclick=load;
$("form").onsubmit=async(e)=>{
  e.preventDefault();
  if($("company").value) return;
  if(Date.now()-state.lastPost<8000){ toast("Give it a second."); return; }
  const name=$("name").value.trim(), text=$("message").value.trim();
  if(!name||!text) return;
  $("send").disabled=true;
  const message = state.pick ? "@@ft@@"+JSON.stringify({ text, title:state.pick.title, type:state.pick.type, tmdb:state.pick.tmdb, poster:state.pick.poster, year:state.pick.year }) : text;
  const res = await fetch(CONFIG.url+"/rest/v1/wall_notes", { method:"POST", headers:{ apikey:CONFIG.key, Authorization:"Bearer "+CONFIG.key, "Content-Type":"application/json", Prefer:"return=representation" }, body:JSON.stringify({ name, message }) });
  $("send").disabled=false;
  if(!res.ok){ toast((await res.text()).slice(0,120)||"Send failed"); return; }
  state.lastPost=Date.now(); localStorage.setItem("ft-name", name);
  $("message").value=""; $("chars").textContent="0";
  toast("Sent. It is in the room now.");
  load();
};
const saved=localStorage.getItem("ft-name"); if(saved) $("name").value=saved;
load(); setInterval(load, 12000);
</script>
</body>
</html>
