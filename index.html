  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --accent: #f59e0b;
      --accent-pink: #ec4899;
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #f1f5f9;
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.06);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      --radius: 16px;
      --sidebar-w: 68px;
      --sidebar-expanded-w: 240px;
      --right-panel-w: 280px;

      --scroll-track: rgba(79, 70, 229, 0.06);
      --scroll-thumb-grad: linear-gradient(180deg, var(--primary), var(--accent-pink));
      --scroll-thumb-hover: linear-gradient(180deg, var(--accent-pink), var(--accent));
      --scroll-thumb-h-grad: linear-gradient(90deg, var(--primary), var(--accent-pink));
      --scroll-thumb-h-hover: linear-gradient(90deg, var(--accent-pink), var(--accent));
    }

    body.theme-sunset {
      --bg: #181438;
      --surface: #221d4d;
      --surface-subtle: #2b2561;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --border: transparent;
      --primary-light: #312a6e;
      --scroll-track: rgba(236, 72, 153, 0.12);
    }

    body.theme-night {
      --bg: #09090b;
      --surface: #121216;
      --surface-subtle: #1c1c24;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: transparent;
      --primary-light: #1e1e2d;
      --scroll-track: rgba(255, 255, 255, 0.06);
    }

    body.theme-lavender {
      --bg: #f3f0ff;
      --surface: #ffffff;
      --surface-subtle: #e9e4ff;
      --text-main: #2e1065;
      --text-muted: #7c3aed;
      --border: #e9e4ff;
      --primary-light: #ede9fe;
      --scroll-track: rgba(139, 92, 246, 0.12);
    }

    body.theme-mint {
      --bg: #ecfdf5;
      --surface: #ffffff;
      --surface-subtle: #d1fae5;
      --text-main: #064e3b;
      --text-muted: #059669;
      --border: #d1fae5;
      --primary-light: #e6fffa;
      --scroll-track: rgba(16, 185, 129, 0.12);
    }

    body.theme-emerald {
      --bg: #062419;
      --surface: #0a3828;
      --surface-subtle: #114b37;
      --text-main: #f0fdf4;
      --text-muted: #6ee7b7;
      --border: transparent;
      --primary-light: #134e3a;
      --scroll-track: rgba(16, 185, 129, 0.15);
    }

    body.theme-navy {
      --bg: #0c1222;
      --surface: #151c2e;
      --surface-subtle: #1e2942;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: transparent;
      --primary-light: #1e293b;
      --scroll-track: rgba(79, 70, 229, 0.15);
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--scroll-track); }
    ::-webkit-scrollbar-thumb { background: var(--scroll-thumb-grad); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }
    * { scrollbar-width: thin; scrollbar-color: var(--primary) var(--scroll-track); }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    img, iframe { max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
