<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BWHS Live Portal</title>
  <style>
    body { margin:0; font-family: system-ui, sans-serif; background:#0a0e17; color:#e6edf3; }
    .dashboard { padding:20px; max-width:1200px; margin:0 auto; }
    .stats { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
    .card { background:#161b22; border:1px solid #30363d; border-radius:10px; padding:16px; min-width:140px; }
    .card b { font-size:2rem; display:block; }
    table { width:100%; border-collapse:collapse; background:#161b22; border-radius:10px; overflow:hidden; }
    th, td { padding:12px; text-align:left; border-bottom:1px solid #30363d; }
    th { background:#21262d; }
    .online { color:#3fb950; }
    .status { margin:10px 0; padding:10px; background:#161b22; border-radius:8px; font-size:0.9rem; }
  </style>
</head>
<body>
  <div class="dashboard">
    <h1>Live Viewers <span id="count" class="online">0</span></h1>
    <div class="status" id="status">Connecting to Firebase...</div>
    <div class="stats">
      <div class="card">Online now<b id="liveCount">0</b></div>
      <div class="card">Total sessions seen<b id="totalSeen">0</b></div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Session</th>
          <th>Page / Title</th>
          <th>Watching</th>
          <th>Last seen</th>
          <th>Started</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p style="margin-top:20px; color:#8b949e; font-size:0.9rem;">
      Entries auto-remove on disconnect. Clean old data in Firebase under <code>presence</code>.
    </p>
  </div>

  <script>
    function loadScript(src, callback) {
      var s = document.createElement("script");
      s.src = src;
      s.onload = callback;
      s.onerror = function() {
        document.getElementById("status").textContent = "Failed to load " + src;
        document.getElementById("status").style.color = "#f85149";
      };
      document.head.appendChild(s);
    }

    function loadLive() {
      const statusEl = document.getElementById("status");
      const BWHS_FIREBASE = {
        apiKey: "AIzaSyBZhtlZRaWQPxFPEP02toZnsFQWOPvbUJA",
        authDomain: "bwhs-audience.firebaseapp.com",
        databaseURL: "https://bwhs-audience-default-rtdb.firebaseio.com",
        projectId: "bwhs-audience",
        storageBucket: "bwhs-audience.firebasestorage.app",
        messagingSenderId: "481701919126",
        appId: "1:481701919126:web:bc6cf2c0dc5d61f4ff85b7"
      };

      // Load Firebase App first, then Database (same pattern as bwhs-stats.js)
      loadScript("https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js", function() {
        loadScript("https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js", function() {
          try {
            if (typeof firebase === "undefined") {
              statusEl.textContent = "firebase is still not defined after loading scripts";
              statusEl.style.color = "#f85149";
              return;
            }

            if (!firebase.apps.length) firebase.initializeApp(BWHS_FIREBASE);
            const db = firebase.database();
            statusEl.textContent = "Connected. Listening for live sessions...";
            statusEl.style.color = "#3fb950";

            db.ref("presence").on("value", function(snap) {
              const now = Date.now();
              const rows = [];
              let live = 0;
              let total = 0;

              if (!snap.exists()) {
                document.getElementById("rows").innerHTML = "<tr><td colspan=5>No sessions yet. Visit the site or test-presence.html in another tab.</td></tr>";
                document.getElementById("liveCount").textContent = "0";
                document.getElementById("count").textContent = "0";
                return;
              }

              snap.forEach(function(ch) {
                total++;
                const v = ch.val() || {};
                const age = now - (v.at || 0);
                const isLive = age < 90000;
                if (isLive) live++;

                const last = v.at ? new Date(v.at).toLocaleTimeString() : "-";
                const started = v.startedAt || v.at ? new Date(v.startedAt || v.at).toLocaleString() : "-";

                rows.push(`
                  <tr>
                    <td>${ch.key.slice(0,12)}...</td>
                    <td>${v.page || "-"}<br><small>${v.title || ""}</small></td>
                    <td>${v.watching || "-"}</td>
                    <td class="${isLive ? 'online' : ''}">${last} ${isLive ? "(live)" : ""}</td>
                    <td>${started}</td>
                  </tr>
                `);
              });

              document.getElementById("liveCount").textContent = live;
              document.getElementById("count").textContent = live;
              document.getElementById("totalSeen").textContent = total;
              document.getElementById("rows").innerHTML = rows.join("") || "<tr><td colspan=5>No active sessions</td></tr>";
            }, function(err) {
              statusEl.textContent = "Permission error (rules?): " + (err.message || err);
              statusEl.style.color = "#f85149";
            });
          } catch (e) {
            statusEl.textContent = "Init error: " + e.message;
            statusEl.style.color = "#f85149";
          }
        });
      });
    }

    loadLive();
  </script>
</body>
</html>
