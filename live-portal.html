<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BWHS Live Portal</title>
  <style>
    body { margin:0; font-family: system-ui, sans-serif; background:#0a0e17; color:#e6edf3; }
    .login { max-width:360px; margin:80px auto; padding:24px; background:#161b22; border-radius:12px; text-align:center; }
    input { width:100%; padding:10px; margin:8px 0; border:1px solid #30363d; border-radius:6px; background:#0d1117; color:#fff; }
    button { width:100%; padding:12px; background:#238636; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:600; }
    .dashboard { display:none; padding:20px; max-width:1200px; margin:0 auto; }
    .stats { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
    .card { background:#161b22; border:1px solid #30363d; border-radius:10px; padding:16px; min-width:140px; }
    .card b { font-size:2rem; display:block; }
    table { width:100%; border-collapse:collapse; background:#161b22; border-radius:10px; overflow:hidden; }
    th, td { padding:12px; text-align:left; border-bottom:1px solid #30363d; }
    th { background:#21262d; }
    .online { color:#3fb950; }
    .logout { float:right; background:#da3633; }
  </style>
</head>
<body>
  <div class="login" id="loginBox">
    <h2>BWHS Live Portal</h2>
    <p>Private admin access</p>
    <input type="password" id="pw" placeholder="Password" autofocus>
    <button onclick="tryLogin()">Enter</button>
    <p style="font-size:0.85rem; color:#8b949e; margin-top:12px;">Password: bwhs-live-2026</p>
  </div>

  <div class="dashboard" id="dash">
    <button class="logout" onclick="logout()">Logout</button>
    <h1>Live Viewers <span id="count" class="online">0</span></h1>
    <div class="stats">
      <div class="card">Online now<b id="liveCount">0</b></div>
      <div class="card">Total sessions seen<b id="totalSeen">0</b></div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Session</th>
          <th>Page / Title</th>
          <th>Watching</th>
          <th>Last seen</th>
          <th>Started</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p style="margin-top:20px; color:#8b949e; font-size:0.9rem;">
      Entries auto-remove on disconnect. You can clean old data in Firebase console under <code>presence</code>.
    </p>
  </div>

  <script>
    const PASSWORD = "bwhs-live-2026";

    function tryLogin() {
      if (document.getElementById("pw").value === PASSWORD) {
        sessionStorage.setItem("bwhs_portal_auth", "1");
        showDash();
      } else {
        alert("Wrong password");
      }
    }

    function logout() {
      sessionStorage.removeItem("bwhs_portal_auth");
      location.reload();
    }

    function showDash() {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("dash").style.display = "block";
      loadLive();
    }

    if (sessionStorage.getItem("bwhs_portal_auth") === "1") {
      showDash();
    }

    function loadLive() {
      const BWHS_FIREBASE = {
        apiKey: "AIzaSyBZhtlZRaWQPxFPEP02toZnsFQWOPvbUJA",
        authDomain: "bwhs-audience.firebaseapp.com",
        databaseURL: "https://bwhs-audience-default-rtdb.firebaseio.com",
        projectId: "bwhs-audience",
        storageBucket: "bwhs-audience.firebasestorage.app",
        messagingSenderId: "481701919126",
        appId: "1:481701919126:web:bc6cf2c0dc5d61f4ff85b7"
      };

      const s = document.createElement("script");
      s.src = "https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js";
      s.onload = function() {
        if (!firebase.apps.length) firebase.initializeApp(BWHS_FIREBASE);
        const db = firebase.database();

        db.ref("presence").on("value", function(snap) {
          const now = Date.now();
          const rows = [];
          let live = 0;
          let total = 0;

          snap.forEach(function(ch) {
            total++;
            const v = ch.val() || {};
            const age = now - (v.at || 0);
            const isLive = age < 90000;
            if (isLive) live++;

            const last = v.at ? new Date(v.at).toLocaleTimeString() : "-";
            const started = v.startedAt || v.at ? new Date(v.startedAt || v.at).toLocaleString() : "-";

            rows.push(`
              <tr>
                <td>${ch.key.slice(0,12)}...</td>
                <td>${v.page || "-"}<br><small>${v.title || ""}</small></td>
                <td>${v.watching || "-"}</td>
                <td class="${isLive ? 'online' : ''}">${last} ${isLive ? "(live)" : ""}</td>
                <td>${started}</td>
              </tr>
            `);
          });

          document.getElementById("liveCount").textContent = live;
          document.getElementById("count").textContent = live;
          document.getElementById("totalSeen").textContent = total;
          document.getElementById("rows").innerHTML = rows.join("") || "<tr><td colspan=5>No active sessions</td></tr>";
        });
      };
      document.head.appendChild(s);
    }
  </script>
</body>
</html>
