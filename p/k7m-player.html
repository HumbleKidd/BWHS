<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="googlebot" content="noindex, nofollow" />
<title>BWHS Player</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<link rel="preconnect" href="https://api.themoviedb.org" />

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@420;560;700;800&family=Fraunces:opsz,wght@9..144,620;9..144,760&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<style>
  :root {
    --ink:#1b1440; --muted:#6d6790; --line:rgba(79,70,229,.12);
    --indigo:#5b4dff; --pink:#ff4d8d; --amber:#ffb020; --mint:#12b981;
    --card:#ffffff; --bg:#f6f3ff;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { min-height:100%; }
  body {
    font-family:Outfit, sans-serif; color:var(--ink);
    background:
      radial-gradient(900px 420px at -10% -10%, rgba(255,77,141,.22), transparent 55%),
      radial-gradient(800px 380px at 110% 0%, rgba(91,77,255,.2), transparent 50%),
      radial-gradient(700px 320px at 80% 100%, rgba(255,176,32,.16), transparent 46%),
      linear-gradient(180deg, #fff, var(--bg) 28%, #fff7fb);
  }
  button, input { font-family:inherit; }
  button { cursor:pointer; }
  a { color:inherit; }
  .wrap { width:min(1240px, calc(100% - 28px)); margin:0 auto; }
  .nav {
    position:sticky; top:10px; z-index:30; margin-top:12px;
    display:flex; align-items:center; gap:12px;
    background:rgba(255,255,255,.86); backdrop-filter:blur(16px);
    border:1px solid #fff; border-radius:22px; padding:8px 10px 8px 12px;
    box-shadow:0 16px 40px rgba(91,77,255,.12);
  }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; min-width:0; }
  .brand img { width:42px; height:42px; object-fit:contain; }
  .brand b { display:block; font-family:Fraunces, serif; letter-spacing:-.03em; font-size:1.05rem; }
  .brand small { color:var(--muted); font-weight:700; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; }
  .search {
    flex:1; display:flex; align-items:center; gap:8px;
    background:#f4f1ff; border-radius:999px; padding:10px 14px; min-width:0;
  }
  .search i { color:var(--indigo); }
  .search input { border:0; outline:0; background:transparent; width:100%; font-weight:650; color:var(--ink); font-size:.92rem; }
  .livebtn, .homebtn {
    border:0; border-radius:999px; padding:10px 14px; font-weight:800; text-decoration:none;
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  }
  .livebtn { background:linear-gradient(135deg, var(--indigo), var(--pink)); color:#fff; box-shadow:0 8px 18px rgba(91,77,255,.28); }
  .homebtn { background:#fff; color:var(--ink); box-shadow:0 6px 16px rgba(27,20,64,.06); }
  .dot { width:8px; height:8px; border-radius:50%; background:#fff; box-shadow:0 0 0 0 rgba(255,255,255,.7); animation:pulse 1.3s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 7px rgba(255,255,255,0); } }
  .stage { margin:16px 0 22px; display:grid; grid-template-columns:1.7fr .9fr; gap:16px; }
  .player {
    position:relative; border-radius:28px; overflow:hidden; background:#fff;
    box-shadow:0 24px 50px rgba(91,77,255,.14); border:1px solid #fff;
  }
  .aura {
    position:absolute; inset:0; background-size:cover; background-position:center;
    filter:blur(18px) saturate(1.2); transform:scale(1.08); opacity:.45;
  }
  .screen {
    position:relative; margin:12px; aspect-ratio:16/9; border-radius:20px; overflow:hidden;
    background:#120c28; box-shadow:0 16px 32px rgba(18,12,40,.28);
  }
  .screen iframe {
    position:absolute; left:0; top:0; width:100%; height:calc(100% + 64px);
    border:0; background:#000; pointer-events:none; z-index:1;
  }
  .crop { display:none; }
  .shield { position:absolute; inset:0 0 72px 0; z-index:3; background:transparent; }
  .hold {
    position:absolute; inset:0; z-index:2; display:none;
    background:#120c28 center/cover no-repeat;
  }
  .hold.on { display:block; }
  .card { content-visibility:auto; contain-intrinsic-size:240px 360px; }
  .veil {
    position:absolute; left:0; right:0; bottom:0; height:86px; z-index:5; display:flex; align-items:flex-end;
    pointer-events:none;
    background:linear-gradient(180deg, rgba(18,12,40,0) 46%, rgba(18,12,40,.72) 100%);
    opacity:1; transition:opacity .28s ease;
  }
  .screen.playing .veil { opacity:0; }
  .screen.playing .veil.show, .screen:hover .veil, .screen:focus-within .veil { opacity:1; }
  .bigplay {
    position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
    width:78px; height:78px; border:0; border-radius:50%; color:#fff; z-index:4;
    background:linear-gradient(135deg, var(--indigo), var(--pink));
    box-shadow:0 16px 30px rgba(91,77,255,.4);
    display:grid; place-items:center; font-size:1.4rem; z-index:5;
  }
  .screen.playing .bigplay { display:none; }
  .controls { width:100%; padding:8px 14px 12px; color:#fff; pointer-events:none; }
  .controls .ib, .controls .scrub, .controls .vol, .controls .speed { pointer-events:auto; }
  .scrub { position:relative; height:18px; display:flex; align-items:center; cursor:pointer; }
  .scrub i, .scrub b {
    position:absolute; left:0; height:6px; border-radius:999px; pointer-events:none;
  }
  .scrub i { width:100%; background:rgba(255,255,255,.28); }
  .scrub b { width:0; background:linear-gradient(90deg, #8d83ff, var(--pink), var(--amber)); }
  .scrub em {
    position:absolute; width:14px; height:14px; border-radius:50%; background:#fff; left:0;
    transform:translateX(-50%); box-shadow:0 0 0 4px rgba(255,77,141,.25); pointer-events:none;
  }
  .row { display:flex; align-items:center; gap:8px; margin-top:6px; }
  .row .spacer { flex:1; }
  .ib {
    width:38px; height:38px; border:0; border-radius:12px; color:#fff;
    background:rgba(255,255,255,.14); display:grid; place-items:center; font-size:.92rem;
    transition:transform .18s ease, background .18s ease;
  }
  .ib:hover { transform:translateY(-1px); background:rgba(255,255,255,.24); }
  .ib.play { width:46px; border-radius:14px; background:linear-gradient(135deg, var(--indigo), var(--pink)); }
  .time { font-weight:800; font-size:.82rem; letter-spacing:.01em; min-width:118px; }
  .time span { opacity:.72; font-weight:700; }
  .vol { width:78px; accent-color:#ff4d8d; }
  .speed {
    border:0; border-radius:999px; background:rgba(255,255,255,.16); color:#fff;
    font-weight:800; padding:7px 10px; font-size:.75rem;
  }
  .meta { display:flex; gap:14px; padding:6px 16px 16px; align-items:flex-start; }
  .meta img { width:62px; height:92px; object-fit:cover; border-radius:12px; background:#efeaff; }
  .kicker { font-size:.68rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--pink); }
  .meta h1 { font-family:Fraunces, serif; font-size:clamp(1.25rem, 2vw, 1.7rem); letter-spacing:-.03em; line-height:1.05; }
  .sub { margin-top:4px; color:var(--muted); font-weight:700; font-size:.8rem; }
  .syn { margin-top:6px; color:#3d3566; font-size:.86rem; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .side {
    background:rgba(255,255,255,.9); border-radius:28px; padding:14px;
    box-shadow:0 18px 40px rgba(91,77,255,.1); border:1px solid #fff;
    display:flex; flex-direction:column; gap:10px; min-height:100%;
  }
  .side h2 { font-size:.95rem; }
  .side p { color:var(--muted); font-size:.75rem; font-weight:700; }
  .up { display:flex; gap:8px; align-items:center; text-align:left; border:0; background:#f7f5ff; border-radius:16px; padding:6px; color:inherit; }
  .up img { width:42px; height:62px; object-fit:cover; border-radius:10px; background:#efeaff; }
  .up strong { display:block; font-size:.82rem; }
  .up em { font-style:normal; color:var(--muted); font-size:.7rem; font-weight:700; }
  .chips { display:flex; gap:8px; overflow:auto; padding:2px 0 12px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    border:0; background:#fff; color:var(--ink); border-radius:999px; padding:9px 13px;
    font-weight:800; font-size:.78rem; box-shadow:0 6px 16px rgba(91,77,255,.08); white-space:nowrap;
  }
  .chip.on { background:linear-gradient(135deg, var(--indigo), var(--pink)); color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:14px; padding-bottom:40px; }
  .card {
    border:0; background:#fff; border-radius:20px; overflow:hidden; text-align:left; color:inherit;
    box-shadow:0 12px 26px rgba(91,77,255,.08); transition:transform .2s ease, box-shadow .2s ease;
  }
  .card:hover { transform:translateY(-4px); box-shadow:0 18px 32px rgba(255,77,141,.16); }
  .card .art { position:relative; aspect-ratio:2/3; background:#efeaff; }
  .card img { width:100%; height:100%; object-fit:cover; display:block; }
  .card .rate {
    position:absolute; left:8px; top:8px; background:#fff; color:#b45309; border-radius:999px;
    font-size:.68rem; font-weight:800; padding:4px 7px;
  }
  .card .body { padding:9px 10px 12px; }
  .card strong { display:block; font-size:.84rem; line-height:1.2; }
  .card span { color:var(--muted); font-size:.72rem; font-weight:700; }
  .toast {
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%) translateY(12px);
    background:#1b1440; color:#fff; border-radius:999px; padding:10px 14px; font-weight:800;
    opacity:0; pointer-events:none; transition:.25s ease; z-index:50;
  }
  .toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
  .spin { width:18px; height:18px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:inline-block; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (max-width: 980px) {
    .stage { grid-template-columns:1fr; }
    .homebtn span, .livebtn span { display:none; }
    .nav { gap:8px; }
  }
  @media (max-width: 680px) {
    .wrap { width:min(100% - 16px, 1240px); }
    .meta { padding-inline:12px; }
    .grid { grid-template-columns:repeat(2, 1fr); gap:10px; }
    .vol { display:none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="nav">
      <a class="brand" href="https://bwhs.online" title="BWHS">
        <img src="https://bwhs.online/Gemini_Generated_Image_kg21fkkg21fkkg21__1_-removebg-preview.png" alt="BWHS" />
        <span><b>BWHS</b><small>Private player</small></span>
      </a>
      <label class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="q" placeholder="Search any film" autocomplete="off" /></label>
      <button class="livebtn" id="liveBtn" type="button"><i class="dot"></i> <span>24/7 live</span></button>
      <a class="homebtn" href="https://bwhs.online"><i class="fa-solid fa-house"></i> <span>Home</span></a>
    </header>

    <section class="stage">
      <div class="player">
        <div class="aura" id="aura"></div>
        <div class="screen" id="screen">
          <iframe id="frame" title="BWHS player" allow="autoplay *; fullscreen *; encrypted-media *; picture-in-picture *" allowfullscreen referrerpolicy="origin"></iframe>
          <div class="hold" id="hold"></div>
          <div class="shield" id="shield"></div>
          <button class="bigplay" id="bigplay" type="button" aria-label="Play"><i class="fa-solid fa-play"></i></button>
          <div class="veil" id="veil">
            <div class="controls">
              <div class="scrub" id="scrub"><i></i><b id="bar"></b><em id="knob"></em></div>
              <div class="row">
                <button class="ib play" id="playBtn" type="button" aria-label="Play or pause"><i class="fa-solid fa-play" id="playIco"></i></button>
                <button class="ib" id="back10" type="button" aria-label="Back 10 seconds"><i class="fa-solid fa-rotate-left"></i></button>
                <button class="ib" id="fwd10" type="button" aria-label="Forward 10 seconds"><i class="fa-solid fa-rotate-right"></i></button>
                <div class="time" id="time">0:00 <span>/ 0:00</span></div>
                <div class="spacer"></div>
                <button class="ib" id="muteBtn" type="button" aria-label="Mute"><i class="fa-solid fa-volume-high" id="muteIco"></i></button>
                <input class="vol" id="vol" type="range" min="0" max="100" value="100" aria-label="Volume" />
                <button class="speed" id="speedBtn" type="button">1x</button>
                <button class="ib" id="nextBtn" type="button" aria-label="Next film"><i class="fa-solid fa-forward-step"></i></button>
                <button class="ib" id="fsBtn" type="button" aria-label="Fullscreen"><i class="fa-solid fa-expand"></i></button>
              </div>
            </div>
          </div>
        </div>
        <div class="meta">
          <img id="poster" alt="" />
          <div>
            <div class="kicker" id="kicker">Pick a film</div>
            <h1 id="title">Your films are ready</h1>
            <div class="sub" id="sub">Tap any poster and it starts immediately.</div>
            <p class="syn" id="syn"></p>
          </div>
        </div>
      </div>
      <aside class="side">
        <h2 id="sideTitle">Up next</h2>
        <p id="sideHint">Recommendations from the same TMDB catalog.</p>
        <div id="upnext"></div>
      </aside>
    </section>

    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
    <div id="more"></div>
  </div>
  <div class="toast" id="toast"></div>
<script>
const TMDB = "https://api.themoviedb.org/3";
const KEY = "129637a8869a61522af21b80f6eb5129";
const IMG = "https://image.tmdb.org/t/p/w342";
const BACK = "https://image.tmdb.org/t/p/w780";
const GENRES = [
  {id:0, name:"Trending"}, {id:-1, name:"Popular"}, {id:-2, name:"Top rated"}, {id:-3, name:"In theatres"},
  {id:28, name:"Action"}, {id:12, name:"Adventure"}, {id:16, name:"Animation"}, {id:35, name:"Comedy"},
  {id:80, name:"Crime"}, {id:18, name:"Drama"}, {id:14, name:"Fantasy"}, {id:27, name:"Horror"},
  {id:9648, name:"Mystery"}, {id:10749, name:"Romance"}, {id:878, name:"Science Fiction"},
  {id:53, name:"Thriller"}, {id:10752, name:"War"}, {id:37, name:"Western"}
];
const $ = id => document.getElementById(id);
const state = {
  film:null, list:[], page:1, genre:0, query:"", loading:false, ended:false,
  playing:false, current:0, duration:0, heard:false, muted:false, volume:1, rate:1,
  hard:false, seekWait:0, pauseWait:0, hideTimer:0, live:false, liveList:[]
};
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"), 1600); }
function fmt(s){
  s = Math.max(0, Math.floor(s||0));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  const p = n => String(n).padStart(2,"0");
  return h ? h+":"+p(m)+":"+p(sec) : m+":"+p(sec);
}
function paintTime(){
  const d = state.duration || (state.film ? state.film.runtime*60 : 0);
  const c = Math.min(state.current, d || state.current);
  $("time").innerHTML = fmt(c)+" <span>/ "+fmt(d)+"</span>";
  const pct = d ? Math.min(100, (c/d)*100) : 0;
  $("bar").style.width = pct+"%";
  $("knob").style.left = pct+"%";
}
function setPlayIcon(){
  $("playIco").className = state.playing ? "fa-solid fa-pause" : "fa-solid fa-play";
  $("bigplay").style.display = state.playing ? "none" : "grid";
  $("screen").classList.toggle("playing", state.playing);
}
function showVeil(){
  $("screen").classList.add("show");
  $("veil").classList.add("show");
  clearTimeout(state.hideTimer);
  state.hideTimer = setTimeout(()=>{ if(state.playing) $("veil").classList.remove("show"); }, 2200);
}
function vix(id, start){
  const q = new URLSearchParams({
    autoplay:"1", autoPlay:"true", lang:"en",
    primaryColor:"5b4dff", secondaryColor:"120c28", skin:"vixsrc",
    canPlayFHD:"1", quality:"2160", maxQuality:"2160", res:"2160",
    startAt:String(Math.max(0, Math.round(start||0))),
    t:String(Math.max(0, Math.round(start||0)))
  });
  return "https://vixsrc.to/movie/"+id+"?"+q.toString();
}
function warm(){}
function command(name, value){
  const frame = $("frame");
  if(!frame.contentWindow) return;
  const packs = [
    {type:"PLAYER_COMMAND", data:{command:name, value}},
    {context:"player.js", version:"0.0.11", method:name, value},
    {method:name, value},
    {action:name, value, time:value},
    {event:"command", func:name, args:value==null?[]:[value]},
    {event:name, currentTime:value},
    name
  ];
  packs.forEach(p => { try { frame.contentWindow.postMessage(p, "*"); } catch(e){} });
}
function mount(start){
  if(!state.film || state.userHold) return;
  state.hard = false;
  state.current = Math.max(0, start || 0);
  state.spot = state.current;
  const frame = $("frame");
  frame.src = vix(state.film.id, state.current);
  frame.addEventListener("load", () => {
    if(state.userHold) return;
    state.heard = true;
    state.anchor = performance.now();
    state.playing = true;
    setPlayIcon();
  }, {once:true});
  paintTime();
}
function hardPause(){
  state.hard = true;
  state.playing = false;
  $("frame").src = "about:blank";
  setPlayIcon();
  paintTime();
}
function showHold(on){
  const hold = $("hold");
  if(state.film && state.film.backdrop) hold.style.backgroundImage = 'url("'+state.film.backdrop+'")';
  hold.classList.toggle("on", !!on);
}
function killFrame(){
  const old = $("frame");
  const fresh = document.createElement("iframe");
  fresh.id = "frame";
  fresh.title = "BWHS player";
  fresh.setAttribute("allow", "autoplay *; fullscreen *; encrypted-media *; picture-in-picture *");
  fresh.allowFullscreen = true;
  fresh.referrerPolicy = "origin";
  fresh.src = "about:blank";
  old.replaceWith(fresh);
  const warm = $("warm");
  if(warm){ warm.removeAttribute("src"); warm.src = "about:blank"; }
}
function stopFilm(){
  state.spot = Math.max(0, state.current || 0);
  state.current = state.spot;
  state.playing = false;
  state.userHold = true;
  state.heard = false;
  state.anchor = 0;
  clearTimeout(state.seekWait);
  showHold(true);
  command("pause");
  killFrame();
  setPlayIcon();
  paintTime();
}
let lastToggle = 0;
function togglePlay(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  const now = Date.now();
  if(now - lastToggle < 450) return;
  lastToggle = now;
  if(!state.film){ toast("Pick a film first"); return; }
  const live = $("frame").src.indexOf("vixsrc.to") !== -1;
  if(state.playing || live){
    stopFilm();
    return;
  }
  const spot = state.spot || state.current || 0;
  state.current = spot;
  state.userHold = false;
  state.resumedAt = performance.now();
  showHold(false);
  mount(spot);
  state.playing = true;
  setPlayIcon();
}
function seekTo(t, commit){
  const d = state.duration || (state.film ? state.film.runtime*60 : 0) || t;
  state.current = Math.max(0, Math.min(t, d));
  state.anchor = performance.now();
  paintTime();
  if(!state.film) return;
  command("setCurrentTime", state.current);
  command("seek", state.current);
  if(!commit) return;
  clearTimeout(state.seekWait);
  const stamp = state.current;
  state.seekWait = setTimeout(()=>{
    if(Math.abs(state.current - stamp) < 0.8 && state.playing) mount(state.current);
  }, 900);
}
function paintFilm(film){
  $("kicker").textContent = state.live ? "Live 24/7" : "Now playing";
  $("title").textContent = film.title;
  document.title = film.title + " · BWHS";
  $("sub").textContent = [film.year, film.runtime ? film.runtime+" min" : "", film.vote ? film.vote.toFixed(1)+" rating" : ""].filter(Boolean).join(" · ");
  $("syn").textContent = film.overview || "";
  $("poster").src = film.poster || "";
  if(film.backdrop) $("aura").style.backgroundImage = 'url("'+film.backdrop+'")';
  state.duration = (film.runtime || 0) * 60;
  paintTime();
}
async function getJSON(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error("tmdb");
  return res.json();
}
function mapMovie(m){
  return {
    id:m.id, title:m.title || m.name, year:(m.release_date||"").slice(0,4),
    overview:m.overview||"", vote:m.vote_average||0, runtime:m.runtime||0,
    poster:m.poster_path ? IMG+m.poster_path : "",
    backdrop:m.backdrop_path ? BACK+m.backdrop_path : ""
  };
}
async function openFilm(film, startAt){
  state.live = false;
  state.film = film;
  if(!film.runtime){
    try {
      const d = await getJSON(TMDB+"/movie/"+film.id+"?api_key="+KEY+"&language=en-US");
      film.runtime = d.runtime || 0;
      film.overview = film.overview || d.overview || "";
      film.backdrop = film.backdrop || (d.backdrop_path ? BACK+d.backdrop_path : "");
    } catch(e){}
  }
  state.current = startAt || 0;
  state.duration = (film.runtime||0)*60;
  state.playing = true;
  paintFilm(film);
  setPlayIcon();
  mount(state.current);
  loadSimilar(film.id);
  try { localStorage.setItem("bwhs-priv-last", JSON.stringify({id:film.id, title:film.title, t:Date.now()})); } catch(e){}
  warm(film.id);
}
function card(film){
  const b = document.createElement("button");
  b.className = "card";
  b.innerHTML = '<div class="art">'+(film.poster?'<img alt="" src="'+film.poster+'">':'')+'<div class="rate"><i class="fa-solid fa-star"></i> '+(film.vote?film.vote.toFixed(1):"—")+'</div></div><div class="body"><strong>'+film.title+'</strong><span>'+(film.year||"Film")+'</span></div>';
  b.addEventListener("click", ()=>openFilm(film, 0));
  b.addEventListener("pointerenter", ()=>warm(film.id), {passive:true});
  return b;
}
async function loadPage(reset){
  if(state.loading) return;
  state.loading = true;
  if(reset){ state.page = 1; state.ended = false; $("grid").innerHTML = ""; state.list = []; }
  let url;
  if(state.query){
    url = TMDB+"/search/movie?api_key="+KEY+"&language=en-US&include_adult=false&query="+encodeURIComponent(state.query)+"&page="+state.page;
  } else if(state.genre === 0){
    url = TMDB+"/trending/movie/week?api_key="+KEY+"&language=en-US&page="+state.page;
  } else if(state.genre === -1){
    url = TMDB+"/movie/popular?api_key="+KEY+"&language=en-US&page="+state.page;
  } else if(state.genre === -2){
    url = TMDB+"/movie/top_rated?api_key="+KEY+"&language=en-US&page="+state.page;
  } else if(state.genre === -3){
    url = TMDB+"/movie/now_playing?api_key="+KEY+"&language=en-US&page="+state.page;
  } else {
    url = TMDB+"/discover/movie?api_key="+KEY+"&language=en-US&include_adult=false&include_video=false&sort_by=popularity.desc&with_genres="+state.genre+"&page="+state.page;
  }
  try {
    const data = await getJSON(url);
    const rows = (data.results||[]).filter(m => m && m.id && m.poster_path).map(mapMovie);
    rows.forEach(f => { state.list.push(f); $("grid").appendChild(card(f)); });
    if(!state.film && rows[0] && reset) paintFilm(rows[0]);
    if(state.page >= (data.total_pages||1) || !rows.length) state.ended = true;
    state.page += 1;
  } catch(e){ toast("Film list did not load"); }
  state.loading = false;
}
async function loadSimilar(id){
  const box = $("upnext");
  box.innerHTML = "";
  try {
    const data = await getJSON(TMDB+"/movie/"+id+"/recommendations?api_key="+KEY+"&language=en-US&page=1");
    const rows = (data.results||[]).slice(0,5).map(mapMovie);
    $("sideTitle").textContent = "Up next";
    $("sideHint").textContent = rows.length ? "Tap one and it starts right away." : "No matches yet.";
    rows.forEach(f => {
      const b = document.createElement("button");
      b.className = "up";
      b.innerHTML = '<img alt="" src="'+(f.poster||"")+'" /><div><strong>'+f.title+'</strong><em>'+(f.year||"Film")+'</em></div>';
      b.addEventListener("click", ()=>openFilm(f, 0));
      box.appendChild(b);
    });
    state.next = rows[0] || null;
  } catch(e){}
}
function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(list, seed){ const rand=mulberry32(seed), arr=list.slice(); for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
async function startLive(){
  toast("Tuning the 24/7 channel");
  state.live = true;
  const day = new Date(Date.now()-5*3600*1000).toISOString().slice(0,10);
  const genre = GENRES.filter(g=>g.id>0)[hash(day)%14];
  $("kicker").textContent = "Live 24/7 · "+genre.name;
  let results = [];
  try {
    const data = await getJSON(TMDB+"/discover/movie?api_key="+KEY+"&include_adult=false&with_genres="+genre.id+"&with_original_language=en&sort_by=vote_count.desc&vote_count.gte=800&vote_average.gte=6.2&page=1");
    results = data.results||[];
  } catch(e){}
  const ids = shuffle(results, hash(day)).slice(0,8).map(m=>m.id);
  const films = [];
  for(const id of ids){
    try {
      const d = await getJSON(TMDB+"/movie/"+id+"?api_key="+KEY+"&language=en-US");
      if(d && d.runtime>=75 && d.runtime<=210) films.push(mapMovie(d));
    } catch(e){}
  }
  if(!films.length){ toast("Live lineup is empty"); return; }
  let cursor = 0;
  const reel = [];
  while(cursor < 26*3600){
    const film = films[reel.length % films.length];
    const dur = film.runtime*60;
    reel.push({...film, start:cursor, dur});
    cursor += dur;
    if(reel.length > 24) break;
  }
  state.liveList = reel;
  const j = new Date(Date.now()-5*3600*1000);
  const intoDay = j.getUTCHours()*3600 + j.getUTCMinutes()*60 + j.getUTCSeconds();
  const total = reel.reduce((n,f)=>n+f.dur,0)||1;
  const pos = intoDay % total;
  let spot = reel[0], into = 0;
  for(const item of reel){ if(pos>=item.start && pos<item.start+item.dur){ spot=item; into=pos-item.start; break; } }
  state.film = spot;
  state.duration = spot.dur;
  state.current = into;
  state.playing = true;
  paintFilm(spot);
  setPlayIcon();
  mount(into);
  const box = $("upnext");
  box.innerHTML = "";
  $("sideTitle").textContent = "On this channel";
  $("sideHint").textContent = genre.name+" lineup for today";
  reel.slice(0,6).forEach(f=>{
    const b=document.createElement("button");
    b.className="up";
    b.innerHTML='<img alt="" src="'+(f.poster||"")+'" /><div><strong>'+f.title+'</strong><em>'+f.runtime+' min</em></div>';
    b.addEventListener("click", ()=>openFilm(f,0));
    box.appendChild(b);
  });
}
window.addEventListener("message", ev => {
  const msg = ev.data;
  if(!msg) return;
  const data = msg.type==="PLAYER_EVENT" ? msg.data : (msg.data && msg.data.event ? msg.data : null);
  if(!data || !data.event) return;
  state.heard = true;
  if(typeof data.duration === "number" && data.duration > 0) state.duration = data.duration;
  if(typeof data.currentTime === "number"){
    const fresh = state.resumedAt && performance.now() - state.resumedAt < 5000;
    if(!(fresh && state.spot > 8 && data.currentTime < 2)){
      state.current = data.currentTime;
      state.spot = data.currentTime;
    }
    state.anchor = performance.now();
  }
  if(state.userHold) return;
      if(data.event === "play" && $("frame").src.indexOf("vixsrc.to") !== -1){ state.playing = true; state.hard = false; showHold(false); clearTimeout(state.pauseWait); }
  if(data.event === "pause"){ state.playing = false; clearTimeout(state.pauseWait); }
  if(data.event === "seeked"){ clearTimeout(state.seekWait); }
  if(data.event === "timeupdate"){ clearTimeout(state.seekWait); if(!state.userHold && state.current > 0.4) state.playing = true; }
  if(data.event === "ended"){
    state.playing = false;
    if(state.next) openFilm(state.next, 0);
  }
  setPlayIcon();
  paintTime();
});
$("playBtn").addEventListener("click", togglePlay);
$("bigplay").addEventListener("click", togglePlay);
$("back10").addEventListener("click", ()=>seekTo(state.current-10, true));
$("fwd10").addEventListener("click", ()=>seekTo(state.current+10, true));
$("nextBtn").addEventListener("click", ()=>{ if(state.next) openFilm(state.next,0); else toast("No next film yet"); });
function applyVolume(){
  $("muteIco").className = state.muted || state.volume === 0 ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high";
  const level = state.muted ? 0 : state.volume;
  command("setVolume", Math.round(level*100));
  command(level === 0 ? "mute" : "unmute");
  const frame = $("frame");
  if(!frame.contentWindow) return;
  try {
    frame.contentWindow.postMessage({type:"PLAYER_COMMAND", data:{command:"setVolume", value:level}}, "*");
    frame.contentWindow.postMessage({event:"command", func: level === 0 ? "mute" : "setVolume", args:[level]}, "*");
    frame.contentWindow.postMessage(JSON.stringify({context:"player.js", version:"0.0.11", method: level === 0 ? "mute" : "setVolume", value: Math.round(level*100)}), "*");
  } catch(e){}
}
function toggleMute(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  state.muted = !state.muted;
  if(!state.muted && state.volume === 0) state.volume = 1;
  $("vol").value = state.muted ? 0 : Math.round(state.volume*100);
  applyVolume();
}
$("muteBtn").addEventListener("pointerdown", e => e.stopPropagation());
$("muteBtn").addEventListener("click", toggleMute);
$("vol").addEventListener("pointerdown", e => e.stopPropagation());
$("vol").addEventListener("input", e => {
  e.stopPropagation();
  state.volume = Number(e.target.value)/100;
  state.muted = state.volume === 0;
  applyVolume();
});

const rates = [1, 1.25, 1.5, 1.75, 2];
$("speedBtn").addEventListener("click", ()=>{
  const i = rates.indexOf(state.rate);
  state.rate = rates[(i+1)%rates.length];
  $("speedBtn").textContent = state.rate+"x";
  command("setPlaybackRate", state.rate);
  toast("Speed "+state.rate+"x");
});
$("fsBtn").addEventListener("click", ()=>{
  const s = $("screen");
  if(document.fullscreenElement) document.exitFullscreen();
  else (s.requestFullscreen||s.webkitRequestFullscreen).call(s);
});
$("liveBtn").addEventListener("click", startLive);
$("screen").addEventListener("click", (e)=>{ if(e.target.closest(".scrub, .vol, .speed, #muteBtn, #vol, #back10, #fwd10, #nextBtn, #fsBtn")) return; togglePlay(e); });
$("shield").addEventListener("dblclick", ()=>{
  const s=$("screen");
  if(document.fullscreenElement) document.exitFullscreen();
  else (s.requestFullscreen||s.webkitRequestFullscreen).call(s);
});
$("scrub").addEventListener("pointerdown", ev => {
  const box = $("scrub").getBoundingClientRect();
  const move = e => {
    const x = Math.min(Math.max(0, e.clientX-box.left), box.width);
    const d = state.duration || (state.film ? state.film.runtime*60 : 0);
    if(d) seekTo((x/box.width)*d, false);
  };
  move(ev);
  const up = ()=>{ window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); seekTo(state.current, true); };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
});
document.addEventListener("keydown", e => {
  if(e.target && e.target.id==="q") return;
  if(e.key===" " || e.key==="p" || e.key==="P" || e.key==="k" || e.key==="K"){ e.preventDefault(); togglePlay(e); }
  if(e.key==="ArrowLeft") seekTo(state.current-10, true);
  if(e.key==="ArrowRight") seekTo(state.current+10, true);
  if(e.key==="f" || e.key==="F") $("fsBtn").click();
  if(e.key==="m" || e.key==="M"){ e.preventDefault(); toggleMute(e); }
});
let qTimer;
$("q").addEventListener("input", e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(()=>{ state.query = e.target.value.trim(); loadPage(true); }, 280);
});
const chips = $("chips");
GENRES.forEach(g => {
  const b = document.createElement("button");
  b.className = "chip"+(g.id===0?" on":"");
  b.textContent = g.name;
  b.addEventListener("click", ()=>{
    document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
    b.classList.add("on");
    state.genre = g.id; state.query=""; $("q").value=""; loadPage(true);
  });
  chips.appendChild(b);
});
const io = new IntersectionObserver(entries => {
  if(entries.some(e=>e.isIntersecting) && !state.ended) loadPage(false);
}, {rootMargin:"400px"});
io.observe($("more"));

state.anchor = 0;
function tick(){
  if(state.playing && state.heard && state.anchor){
    const step = (performance.now() - state.anchor) / 1000;
    if(step > 0 && step < 1.2) state.current += step;
    state.anchor = performance.now();
    paintTime();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

loadPage(true);
</script>
</body>
</html>
