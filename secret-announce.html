<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BWHS Secret Announcer — Level Up</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); color: #f8fafc; margin: 0; padding: 16px; min-height: 100vh; }
  .wrap { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 380px; gap: 20px; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  .panel { background: rgba(30,41,59,.85); backdrop-filter: blur(12px); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,.08); box-shadow: 0 20px 50px rgba(0,0,0,.4); }
  h1 { margin: 0 0 6px; font-size: 1.5rem; background: linear-gradient(90deg, #a78bfa, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { color: #94a3b8; margin: 0 0 16px; font-size: .9rem; }
  .section { margin-bottom: 16px; }
  .section label { display: block; font-weight: 700; font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; color: #c4b5fd; margin-bottom: 6px; }
  .toolbar { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .toolbar button { width: auto; padding: 6px 10px; font-size: .8rem; background: #334155; }
  .toolbar button:hover { background: #4f46e5; }
  #editor { min-height: 120px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px; outline: none; line-height: 1.5; overflow: auto; }
  #editor:focus { border-color: #8b5cf6; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 120px; }
  input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: .95rem; }
  button { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; border: 0; padding: 12px 16px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: transform .15s, box-shadow .15s; }
  button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(79,70,229,.4); }
  button.secondary { background: #334155; }
  .targets, .positions { display: flex; gap: 8px; flex-wrap: wrap; }
  .targets label, .positions label { display: flex; align-items: center; gap: 6px; background: #0f172a; padding: 8px 12px; border-radius: 999px; cursor: pointer; font-size: .85rem; font-weight: 600; border: 1px solid transparent; }
  .targets input, .positions input { width: auto; margin: 0; }
  .targets label:has(input:checked), .positions label:has(input:checked) { border-color: #8b5cf6; background: #1e1b4b; }
  .movie-results { max-height: 180px; overflow: auto; background: #0f172a; border-radius: 10px; margin-top: 6px; }
  .movie-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; cursor: pointer; border-radius: 8px; }
  .movie-item:hover { background: #1e293b; }
  .movie-item img { width: 36px; height: 52px; object-fit: cover; border-radius: 4px; background: #334155; }
  .selected-movie { display: flex; align-items: center; gap: 10px; background: #1e1b4b; padding: 8px; border-radius: 10px; margin-top: 6px; }
  .selected-movie img { width: 48px; height: 70px; object-fit: cover; border-radius: 6px; }
  .preview-box { min-height: 200px; border-radius: 16px; overflow: hidden; position: relative; background: #020617; }
  .status { margin-top: 10px; font-size: .9rem; color: #a5b4fc; min-height: 1.2em; }
  .img-preview { max-width: 100%; max-height: 120px; border-radius: 8px; margin-top: 6px; display: none; }
  .links-list { font-size: .85rem; color: #cbd5e1; }
  .links-list div { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid #1e293b; }
  .small { font-size: .75rem; color: #64748b; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>BWHS Live Announcer</h1>
    <p class="sub">Compose a vibrant announcement, tag movies, add images & links, choose where and how it appears, then push live.</p>

    <div class="section">
      <label>Message (select text → format)</label>
      <div class="toolbar">
        <button type="button" onclick="fmt('bold')" title="Bold"><b>B</b></button>
        <button type="button" onclick="fmt('italic')" title="Italic"><i>I</i></button>
        <button type="button" onclick="fmt('underline')" title="Underline"><u>U</u></button>
        <button type="button" onclick="document.execCommand('insertLineBreak') || document.execCommand('insertHTML', false, '<br>')" title="Line break">↵</button>
        <button type="button" onclick="fmt('insertUnorderedList')" title="List">• List</button>
      </div>
      <div id="editor" contenteditable="true"></div>
    </div>

    <div class="section">
      <label>Image (upload or paste link)</label>
      <div class="row">
        <input type="file" id="imgFile" accept="image/*" onchange="onFile(this)">
        <input type="url" id="imgUrl" placeholder="or paste image URL" oninput="onUrl(this.value)">
      </div>
      <img id="imgPreview" class="img-preview" alt="">
    </div>

    <div class="section">
      <label>Tag a film (search TMDB)</label>
      <input id="movieSearch" placeholder="Search movie or TV..." oninput="searchMovies(this.value)">
      <div id="movieResults" class="movie-results"></div>
      <div id="selectedMovie" class="selected-movie" style="display:none"></div>
    </div>

    <div class="section">
      <label>Extra clickable links</label>
      <div class="row">
        <input id="linkLabel" placeholder="Label (optional)">
        <input id="linkUrl" placeholder="https://...">
        <button type="button" class="secondary" onclick="addLink()">Add</button>
      </div>
      <div id="linksList" class="links-list"></div>
    </div>

    <div class="section">
      <label>Where to show</label>
      <div class="targets">
        <label><input type="checkbox" id="tAll" onchange="toggleAll(this)"> Select All</label>
        <label><input type="checkbox" value="home" class="tgt"> Home Screen</label>
        <label><input type="checkbox" value="247" class="tgt"> 24/7 PLAY</label>
        <label><input type="checkbox" value="fullscreen" class="tgt"> Fullscreen</label>
        <label><input type="checkbox" value="all" class="tgt"> All Screens</label>
      </div>
    </div>

    <div class="section">
      <label>Position</label>
      <div class="positions">
        <label><input type="radio" name="pos" value="top" checked> Top</label>
        <label><input type="radio" name="pos" value="middle"> Middle (cute modal)</label>
        <label><input type="radio" name="pos" value="bottom"> Bottom</label>
      </div>
    </div>

    <button id="pushBtn" onclick="push()">Push Live Now</button>
    <div class="status" id="status"></div>
    <p class="small">Image uploads use Firebase Storage. If it fails, paste a public image URL instead. Update Storage rules if needed.</p>
  </div>

  <div class="panel">
    <h1 style="font-size:1.2rem">Live Preview</h1>
    <p class="sub">Exactly how it will appear</p>
    <div id="preview" class="preview-box"></div>
    <button type="button" class="secondary" style="margin-top:12px;width:100%" onclick="updatePreview()">Refresh Preview</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<script>
const CFG = {
  apiKey: "AIzaSyBZhtlZRaWQPxFPEP02toZnsFQWOPvbUJA",
  authDomain: "bwhs-audience.firebaseapp.com",
  databaseURL: "https://bwhs-audience-default-rtdb.firebaseio.com",
  projectId: "bwhs-audience",
  storageBucket: "bwhs-audience.firebasestorage.app",
  messagingSenderId: "481701919126",
  appId: "1:481701919126:web:bc6cf2c0dc5d61f4ff85b7"
};
const TMDB_KEY = "129637a8869a61522af21b80f6eb5129";
firebase.initializeApp(CFG);
const db = firebase.database();
const storage = firebase.storage();

let imageUrl = "";
let selectedMovie = null;
let extraLinks = [];

function fmt(cmd) {
  document.execCommand(cmd, false, null);
  document.getElementById("editor").focus();
  updatePreview();
}

function onUrl(v) {
  imageUrl = v.trim();
  const img = document.getElementById("imgPreview");
  if (imageUrl) { img.src = imageUrl; img.style.display = "block"; }
  else img.style.display = "none";
  updatePreview();
}

function onFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    // Prefer Storage; fallback to data URL for small files
    const ref = storage.ref("announcements/" + Date.now() + "-" + file.name.replace(/[^a-z0-9.]/gi, "_"));
    const task = ref.put(file);
    task.on("state_changed", null, err => {
      console.warn("Storage upload failed, using data URL", err);
      if (file.size < 400000) {
        imageUrl = e.target.result;
        onUrl(imageUrl);
      } else {
        alert("Upload failed and file too large for direct. Paste a public image URL instead.");
      }
    }, async () => {
      imageUrl = await task.snapshot.ref.getDownloadURL();
      onUrl(imageUrl);
    });
  };
  reader.readAsDataURL(file);
}

let searchTimer;
function searchMovies(q) {
  clearTimeout(searchTimer);
  const box = document.getElementById("movieResults");
  if (!q || q.length < 2) { box.innerHTML = ""; return; }
  searchTimer = setTimeout(async () => {
    try {
      const r = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}&include_adult=false`);
      const d = await r.json();
      const items = (d.results || []).filter(x => x.media_type === "movie" || x.media_type === "tv").slice(0, 8);
      box.innerHTML = items.map(m => {
        const title = m.title || m.name;
        const poster = m.poster_path ? `https://image.tmdb.org/t/p/w92${m.poster_path}` : "";
        const year = (m.release_date || m.first_air_date || "").slice(0, 4);
        return `<div class="movie-item" onclick="pickMovie(${m.id}, '${(title||"").replace(/'/g,"\\'")}', '${poster}', '${m.media_type}')">
          ${poster ? `<img src="${poster}" alt="">` : ""}
          <div><b>${title}</b><br><span style="color:#94a3b8;font-size:.75rem">${m.media_type} · ${year}</span></div>
        </div>`;
      }).join("") || "<div style='padding:8px;color:#64748b'>No results</div>";
    } catch (e) { box.innerHTML = "<div style='padding:8px;color:#f87171'>Search error</div>"; }
  }, 350);
}

function pickMovie(id, title, poster, type) {
  selectedMovie = { id, title, poster, type };
  document.getElementById("movieResults").innerHTML = "";
  document.getElementById("movieSearch").value = title;
  const el = document.getElementById("selectedMovie");
  el.style.display = "flex";
  el.innerHTML = `${poster ? `<img src="${poster}" alt="">` : ""}<div><b>${title}</b><br><span style="color:#a78bfa;font-size:.8rem">${type} · clickable in announcement</span></div><button type="button" class="secondary" style="margin-left:auto;padding:4px 8px" onclick="clearMovie()">×</button>`;
  updatePreview();
}
function clearMovie() {
  selectedMovie = null;
  document.getElementById("selectedMovie").style.display = "none";
  document.getElementById("movieSearch").value = "";
  updatePreview();
}

function addLink() {
  const label = document.getElementById("linkLabel").value.trim() || "Open link";
  const url = document.getElementById("linkUrl").value.trim();
  if (!url) return;
  extraLinks.push({ label, url });
  document.getElementById("linkLabel").value = "";
  document.getElementById("linkUrl").value = "";
  renderLinks();
  updatePreview();
}
function renderLinks() {
  document.getElementById("linksList").innerHTML = extraLinks.map((l, i) =>
    `<div><span>${l.label} → ${l.url}</span><button type="button" class="secondary" style="padding:2px 6px" onclick="extraLinks.splice(${i},1);renderLinks();updatePreview()">×</button></div>`
  ).join("");
}

function toggleAll(cb) {
  document.querySelectorAll(".tgt").forEach(x => x.checked = cb.checked);
}

function getTargets() {
  const t = Array.from(document.querySelectorAll(".tgt:checked")).map(x => x.value);
  if (document.getElementById("tAll").checked || t.includes("all")) return ["home", "247", "fullscreen", "all"];
  return t;
}
function getPosition() {
  return document.querySelector('input[name="pos"]:checked').value;
}

function buildHtml() {
  const text = document.getElementById("editor").innerHTML || "";
  const pos = getPosition();
  const isMiddle = (pos === "middle" || pos === "center");
  let html = `<div class="ann-text">${text}</div>`;
  if (imageUrl) html += `<img class="ann-img" src="${imageUrl}" alt="" style="max-width:100%;border-radius:12px;margin:10px 0;display:block">`;
  if (selectedMovie) {
    const hash = selectedMovie.type === "tv" ? `#/watch/tv/${selectedMovie.id}/1/1` : `#/watch/movie/${selectedMovie.id}`;
    const base = location.origin + location.pathname.replace(/secret-announce\.html$/, "");
    const href = base + hash;
    const poster = selectedMovie.poster ? selectedMovie.poster.replace("w92", "w185") : "";
    if (isMiddle) {
      html += `<a class="ann-movie-modal" href="${href}" target="_blank">
        ${poster ? `<img src="${poster}" alt="">` : ""}
        <div><b>${selectedMovie.title}</b><br><span style="font-size:.82rem;opacity:.85">Watch now →</span></div>
      </a>`;
    } else {
      html += `<a class="ann-movie-compact" href="${href}" target="_blank">
        ${poster ? `<img src="${poster}" alt="">` : ""}
        <span>${selectedMovie.title}</span>
      </a>`;
    }
  }
  extraLinks.forEach(l => {
    html += `<a href="${l.url}" target="_blank" style="display:inline-block;margin:4px 6px 4px 0;padding:6px 12px;background:#4f46e5;color:#fff;border-radius:999px;text-decoration:none;font-weight:700;font-size:.85rem">${l.label}</a>`;
  });
  return html;
}

function updatePreview() {
  const pos = getPosition();
  const html = buildHtml();
  const box = document.getElementById("preview");
  box.innerHTML = "";
  const style = pos === "middle" || pos === "center"
    ? "position:absolute;inset:20px;display:flex;align-items:center;justify-content:center"
    : pos === "bottom"
      ? "position:absolute;bottom:0;left:0;right:0;padding:16px"
      : "position:absolute;top:0;left:0;right:0;padding:16px";
  const inner = pos === "middle" || pos === "center"
    ? `<div style="background:linear-gradient(145deg,#1e1b4b,#312e81,#4c1d95);border-radius:24px;padding:24px;max-width:360px;box-shadow:0 25px 50px rgba(0,0,0,.5);animation:pop .4s ease">${html}</div>`
    : `<div style="background:linear-gradient(90deg,#4f46e5,#ec4899);padding:14px 18px;border-radius:${pos==='top'?'0 0 16px 16px':'16px 16px 0 0'};box-shadow:0 8px 24px rgba(0,0,0,.4);animation:slide .4s ease">${html}</div>`;
  box.innerHTML = `<div style="${style}">${inner}</div><style>@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}@keyframes slide{from{transform:translateY(${pos==='bottom'?20:-20}px);opacity:0}to{transform:none;opacity:1}}</style>`;
}
document.getElementById("editor").addEventListener("input", updatePreview);
updatePreview();

async function push() {
  const targets = getTargets();
  if (!targets.length) { alert("Select at least one place to show"); return; }
  const html = buildHtml();
  if (!document.getElementById("editor").innerText.trim() && !imageUrl && !selectedMovie) {
    alert("Add a message, image, or movie first"); return;
  }
  const btn = document.getElementById("pushBtn");
  const status = document.getElementById("status");
  btn.disabled = true;
  status.textContent = "Pushing…";
  const payload = {
    html,
    text: document.getElementById("editor").innerText,
    image: imageUrl || null,
    movie: selectedMovie,
    links: extraLinks,
    targets,
    position: getPosition(),
    at: firebase.database.ServerValue.TIMESTAMP,
    id: Date.now()
  };
  try {
    await db.ref("announcements/current").set(payload);
    status.textContent = "Pushed! Live now on selected screens.";
    setTimeout(() => status.textContent = "", 5000);
  } catch (err) {
    status.textContent = "Error: " + (err.message || err) + " — check Database rules allow announcements write.";
  }
  btn.disabled = false;
}
</script>
</body>
</html>
