<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BWHS Secret Announcer</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0f172a; color:#f8fafc; margin:0; padding:20px; }
  .box { max-width:560px; margin:40px auto; background:#1e293b; border-radius:16px; padding:24px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  h1 { margin:0 0 8px; font-size:1.4rem; }
  p { color:#94a3b8; margin:0 0 16px; }
  textarea, input { width:100%; box-sizing:border-box; padding:12px; border-radius:10px; border:1px solid #334155; background:#0f172a; color:#fff; font-size:1rem; margin-bottom:12px; }
  button { background:#4f46e5; color:#fff; border:0; padding:12px 20px; border-radius:10px; font-weight:700; cursor:pointer; width:100%; }
  button:hover { background:#4338ca; }
  button:disabled { opacity:.6; }
  .status { margin-top:12px; font-size:.9rem; color:#a5b4fc; min-height:1.2em; }
  .pin-gate { text-align:center; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="box">
  <div id="gate" class="pin-gate">
    <h1>Secret Announcer</h1>
    <p>Enter PIN to continue</p>
    <input id="pin" type="password" placeholder="PIN" maxlength="12">
    <button onclick="checkPin()">Unlock</button>
  </div>
  <div id="panel" class="hidden">
    <h1>BWHS Live Announcer</h1>
    <p>Type a message and push — it appears instantly on every open BWHS page (no reload needed).</p>
    <textarea id="msg" rows="5" placeholder="What do you want to announce right now?"></textarea>
    <button id="push" onclick="push()">Push to Everyone</button>
    <div class="status" id="status"></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script>
const PIN = "bwhs2026"; // change this if you want
const CFG = {
  apiKey: "AIzaSyBZhtlZRaWQPxFPEP02toZnsFQWOPvbUJA",
  authDomain: "bwhs-audience.firebaseapp.com",
  databaseURL: "https://bwhs-audience-default-rtdb.firebaseio.com",
  projectId: "bwhs-audience",
  storageBucket: "bwhs-audience.firebasestorage.app",
  messagingSenderId: "481701919126",
  appId: "1:481701919126:web:bc6cf2c0dc5d61f4ff85b7"
};
firebase.initializeApp(CFG);
const db = firebase.database();

function checkPin() {
  if (document.getElementById("pin").value === PIN) {
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("panel").classList.remove("hidden");
    document.getElementById("msg").focus();
  } else {
    alert("Wrong PIN");
  }
}
document.getElementById("pin").addEventListener("keydown", e => { if (e.key === "Enter") checkPin(); });

function push() {
  const text = document.getElementById("msg").value.trim();
  if (!text) return;
  const btn = document.getElementById("push");
  const status = document.getElementById("status");
  btn.disabled = true;
  status.textContent = "Pushing…";
  db.ref("announcements/current").set({
    text: text,
    at: firebase.database.ServerValue.TIMESTAMP,
    id: Date.now()
  }).then(() => {
    status.textContent = "Pushed! Everyone sees it now.";
    document.getElementById("msg").value = "";
    btn.disabled = false;
    setTimeout(() => status.textContent = "", 4000);
  }).catch(err => {
    status.textContent = "Error: " + (err.message || err);
    btn.disabled = false;
  });
}
</script>
</body>
</html>
