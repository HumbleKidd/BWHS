<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BWHS Presence Test</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; background: #111; color: #eee; }
    #status { padding: 12px; background: #222; border-radius: 8px; margin: 10px 0; }
    .ok { color: #3fb950; }
    .err { color: #f85149; }
    pre { background: #1a1a1a; padding: 12px; border-radius: 6px; overflow: auto; font-size: 13px; }
  </style>
</head>
<body>
  <h1>BWHS Presence Test</h1>
  <div id="status">Loading...</div>
  <pre id="log"></pre>

  <script>
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");

    function log(msg, isError) {
      const line = document.createElement("div");
      line.textContent = new Date().toLocaleTimeString() + " — " + msg;
      if (isError) line.className = "err";
      else line.className = "ok";
      logEl.appendChild(line);
    }

    window.onBWHSSuccess = function(id) {
      statusEl.innerHTML = '<span class="ok">Success! Presence written for ' + id + '</span><br>Refresh the Firebase data view — you should see a presence node.';
      log("Write succeeded for " + id);
    };

    window.onBWHSError = function(msg) {
      statusEl.innerHTML = '<span class="err">Error: ' + msg + '</span>';
      log("Error: " + msg, true);
    };
  </script>

  <script src="bwhs-stats.js"></script>
</body>
</html>
