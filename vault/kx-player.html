<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>BWHS Studio Player</title>
<link rel="icon" href="https://bwhs.online/favicon-32x32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Outfit:wght@360;500;650&display=swap" rel="stylesheet" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
<style>
  :root { --ink:#1b130e; --soft:#5e534a; --paper:#f6f0e6; --card:#fffdf8; --line:rgba(27,19,14,.1); --ember:#ff4b2b; --gold:#e7a322; --stage:#120d0a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: Outfit, sans-serif; color: var(--ink); background: radial-gradient(900px 420px at 0 -10%, rgba(255,75,43,.16), transparent 55%), radial-gradient(800px 420px at 100% 0, rgba(15,143,132,.14), transparent 50%), var(--paper); }
  button, input { font-family: inherit; }
  button { cursor: pointer; }
  .app { max-width: 1440px; margin: 0 auto; padding: 16px 16px 70px; }
  .topbar { display: flex; gap: 12px; align-items: center; position: sticky; top: 10px; z-index: 30; background: rgba(255,253,248,.82); border: 1px solid var(--line); border-radius: 999px; padding: 8px 10px 8px 14px; backdrop-filter: blur(16px); }
  .brand { display: flex; gap: 10px; align-items: center; text-decoration: none; color: inherit; min-width: 170px; }
  .brand img { width: 34px; height: 34px; border-radius: 11px; }
  .brand b { font-family: Fraunces, serif; }
  .brand small { display: block; color: var(--soft); letter-spacing: .12em; text-transform: uppercase; font-size: 10px; }
  .search { flex: 1; display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 0 12px; }
  .search input { border: 0; outline: 0; height: 40px; width: 100%; background: transparent; font-size: 15px; }
  .pill, .icon-btn { border: 1px solid var(--line); background: #fff; border-radius: 999px; height: 38px; padding: 0 12px; }
  .pill.active, .srv.active { background: var(--ink); color: #fff; }
  .filters, .srv-row, .rail { display: flex; gap: 8px; overflow: auto; scrollbar-width: none; }
  .filters { padding: 14px 0 4px; }
  .shelf-head { display: flex; justify-content: space-between; align-items: end; }
  h1, h2 { font-family: Fraunces, serif; letter-spacing: -.03em; }
  h1 { font-size: clamp(32px, 5vw, 58px); line-height: .95; margin: 10px 0; }
  h1 em { color: var(--ember); font-style: italic; }
  .hero { display: grid; grid-template-columns: 1.3fr .8fr; gap: 16px; margin-top: 18px; }
  .hero-card { min-height: 210px; border-radius: 26px; background: #efe6d8 center/cover; position: relative; overflow: hidden; }
  .hero-card span { position: absolute; left: 16px; right: 16px; bottom: 14px; color: #fff; font-family: Fraunces, serif; font-size: 26px; text-shadow: 0 8px 20px rgba(0,0,0,.4); }
  .rail { display: grid; grid-auto-flow: column; grid-auto-columns: 158px; gap: 12px; overflow: auto; padding-bottom: 8px; }
  .card { border: 0; background: transparent; text-align: left; padding: 0; color: inherit; }
  .poster { aspect-ratio: 2/3; border-radius: 16px; overflow: hidden; background: #efe6d8; }
  .poster img { width: 100%; height: 100%; object-fit: cover; }
  .card strong { display: block; margin-top: 6px; font-size: 13px; }
  .layout { display: none; margin-top: 16px; grid-template-columns: minmax(0,1.7fr) 340px; gap: 14px; }
  .layout.on { display: grid; }
  .stage-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 28px; padding: 12px; }
  .stage { position: relative; background: var(--stage); border-radius: 20px; overflow: hidden; aspect-ratio: 16/9; }
  .stage iframe { position: absolute; inset: -7% -4% -12%; width: 108%; height: 122%; border: 0; pointer-events: none; transform: scale(1.02); }
  .shield { position: absolute; inset: 0; z-index: 4; }
  .chrome { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; padding: 18px 12px 12px; background: linear-gradient(transparent, rgba(0,0,0,.78)); color: #fff; }
  .top-chrome { position: absolute; left: 0; right: 0; top: 0; z-index: 5; display: flex; justify-content: space-between; padding: 10px; background: linear-gradient(rgba(0,0,0,.55), transparent); }
  .ghost, .ctl { border: 0; color: #fff; background: rgba(255,255,255,.16); border-radius: 999px; height: 36px; padding: 0 12px; }
  .bar { display: flex; align-items: center; gap: 8px; }
  .scrub { flex: 1; appearance: none; height: 6px; border-radius: 99px; background: rgba(255,255,255,.28); outline: none; }
  .scrub::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--ember); }
  .time { font-variant-numeric: tabular-nums; font-size: 12px; min-width: 92px; }
  .ctl-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .side { background: rgba(255,253,248,.84); border: 1px solid var(--line); border-radius: 24px; padding: 16px; }
  .chip { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px; margin: 0 6px 6px 0; font-size: 12px; background: #fff; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: 999px; padding: 10px 14px; opacity: 0; transition: .2s; }
  .toast.on { opacity: 1; }
  .bigplay { position: absolute; inset: 0; margin: auto; width: 74px; height: 74px; border: 0; border-radius: 50%; background: var(--ember); color: #fff; font-size: 26px; z-index: 6; box-shadow: 0 12px 30px rgba(0,0,0,.28); }
  @media (max-width: 900px) { .hero, .layout.on { grid-template-columns: 1fr; } .brand small { display: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="#/" id="home"><img src="https://bwhs.online/android-chrome-192x192.png" alt="" /><span><b>BWHS Studio</b><small>Your controls only</small></span></a>
    <label class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="q" placeholder="Search films" /></label>
    <button class="icon-btn" id="listBtn">List</button>
  </header>
  <section class="hero" id="hero">
    <div><div class="pill">Private player · iframe controls blocked</div><h1>Your player. <em>Their stream.</em></h1><p>The embed sits underneath and cannot be clicked. Play, pause, seek, volume, and fullscreen all happen on this skin.</p></div>
    <div class="hero-card" id="heroCard"><span id="heroTitle">Loading films</span></div>
  </section>
  <div class="filters" id="filters"></div>
  <section id="catalog"><div class="shelf-head"><h2 id="shelfTitle">Now playing</h2></div><div class="rail" id="rail"></div></section>
  <section class="layout" id="layout">
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <iframe id="frame" allow="autoplay; fullscreen; encrypted-media" referrerpolicy="origin"></iframe>
        <div class="shield" id="shield"></div>
        <button class="bigplay" id="bigplay"><i class="fa-solid fa-play"></i></button>
        <div class="top-chrome">
          <button class="ghost" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Catalog</button>
          <button class="ghost" id="srvName">VixSrc</button>
        </div>
        <div class="chrome">
          <div class="bar">
            <span class="time" id="cur">00:00</span>
            <input class="scrub" id="scrub" type="range" min="0" max="1000" value="0" />
            <span class="time" id="dur">00:00</span>
          </div>
          <div class="ctl-row">
            <button class="ctl" id="playBtn"><i class="fa-solid fa-play"></i></button>
            <button class="ctl" id="back10">-10</button>
            <button class="ctl" id="fwd10">+10</button>
            <button class="ctl" id="muteBtn"><i class="fa-solid fa-volume-high"></i></button>
            <input id="vol" type="range" min="0" max="100" value="100" style="width:90px" />
            <button class="ctl" id="rateBtn">1x</button>
            <button class="ctl" id="nextSrv">Next server</button>
            <button class="ctl" id="fsBtn">Fullscreen</button>
          </div>
        </div>
      </div>
      <div class="srv-row" id="servers" style="margin-top:10px"></div>
    </div>
    <aside class="side" id="meta"></aside>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
const API = "129637a8869a61522af21b80f6eb5129";
const TMDB = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p";
const PROVIDERS = [
  { id:"vixsrc", name:"VixSrc", build:(id,t)=>`https://vixsrc.to/movie/${id}?autoplay=1&autoPlay=true&startAt=${t||0}&lang=en&primaryColor=ff4b2b&secondaryColor=120d0a&canPlayFHD=1&quality=2160` },
  { id:"vidlink", name:"VidLink", build:(id,t)=>`https://vidlink.pro/movie/${id}?autoplay=true&startAt=${t||0}&title=false&poster=false&primaryColor=ff4b2b&icons=vid&muted=false` },
  { id:"vidsrc", name:"VidSrc", build:(id,t)=>`https://vidsrc.xyz/embed/movie?tmdb=${id}&autoplay=1&ds_lang=en` },
  { id:"vidcore", name:"VidCore", build:(id)=>`https://vidcore.org/embed/movie/${id}?autoplay=1&theme=ff4b2b` },
  { id:"vidapi", name:"VidAPI", build:(id)=>`https://vidapi.ru/embed/movie/${id}?autoplay=1` },
  { id:"moviesapi", name:"MoviesAPI", build:(id)=>`https://moviesapi.club/movie/${id}?autoplay=1` },
  { id:"vidbolt", name:"VidBolt", build:(id)=>`https://vidbolt.xyz/embed/movie/${id}?autoplay=1` },
  { id:"upcloud", name:"UpCloud", build:(id)=>`https://vidsrc.cc/v2/embed/movie/${id}?autoplay=1` }
];
const frame = document.getElementById("frame");
const S = { provider:"vixsrc", film:null, t:0, d:0, paused:true, muted:false, vol:1, rate:1, seeking:false };
function toast(m){ const el=document.getElementById("toast"); el.textContent=m; el.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),1600); }
function esc(s){ return String(s??"").replace(/&/g,"&"+"amp;").replace(/</g,"&"+"lt;").replace(/>/g,"&"+"gt;").replace(/"/g,"&"+"quot;"); }
async function tmdb(path){ const j=path.includes("?")?"&":"?"; const r=await fetch(TMDB+path+j+"api_key="+API); if(!r.ok) throw new Error("TMDB "+r.status); return r.json(); }
function provider(){ return PROVIDERS.find(p=>p.id===S.provider)||PROVIDERS[0]; }
function fmt(n){ n=Math.max(0,Math.floor(n||0)); return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0"); }
function paintTime(){ document.getElementById("cur").textContent=fmt(S.t); document.getElementById("dur").textContent=fmt(S.d); if(!S.seeking && S.d) document.getElementById("scrub").value=Math.round((S.t/S.d)*1000); }
function post(msg){ try { frame.contentWindow.postMessage(msg,"*"); } catch(e){} }
function command(kind, value){
  const msgs = [];
  if (kind==="play") msgs.push({type:"play"},{event:"play"},{action:"play"},{method:"play"},{event:"command",func:"playVideo",args:[]},{command:"play"});
  if (kind==="pause") msgs.push({type:"pause"},{event:"pause"},{action:"pause"},{method:"pause"},{event:"command",func:"pauseVideo",args:[]},{command:"pause"});
  if (kind==="seek") msgs.push({type:"seek",currentTime:value,time:value,value},{event:"seek",currentTime:value},{method:"seek",value},{event:"command",func:"seekTo",args:[value,true]});
  if (kind==="mute") msgs.push({type:"mute"},{event:"mute"},{method:"mute"},{event:"command",func:"mute",args:[]});
  if (kind==="unmute") msgs.push({type:"unmute"},{event:"unmute"},{method:"unmute"},{muted:false},{event:"command",func:"unMute",args:[]});
  if (kind==="volume") msgs.push({type:"volume",value},{event:"volume",value},{method:"setVolume",value},{event:"command",func:"setVolume",args:[Math.round(value*100)]});
  if (kind==="rate") msgs.push({type:"playbackRate",value},{method:"setPlaybackRate",value},{event:"command",func:"setPlaybackRate",args:[value]});
  msgs.forEach(post);
}
function setPaused(p){ S.paused=p; document.getElementById("playBtn").innerHTML = p ? '<i class="fa-solid fa-play"></i>' : '<i class="fa-solid fa-pause"></i>'; document.getElementById("bigplay").style.display = p ? "block" : "none"; }
function toggle(){ if(S.paused){ command("play"); setPaused(false); } else { command("pause"); setPaused(true); } }
function seekTo(sec){ S.t=Math.max(0,sec); paintTime(); command("seek", S.t); if(S.provider==="vixsrc" || S.provider==="vidlink"){ frame.src = provider().build(S.film.id, Math.floor(S.t)); } }
function loadFrame(){
  if(!S.film) return;
  frame.src = provider().build(S.film.id, Math.floor(S.t||0));
  document.getElementById("srvName").textContent = provider().name;
  document.querySelectorAll(".srv").forEach(b=>b.classList.toggle("active", b.dataset.srv===S.provider));
  setPaused(false);
  toast("Your player · "+provider().name);
}
function renderServers(){
  document.getElementById("servers").innerHTML = PROVIDERS.map(p=>`<button class="pill srv ${p.id===S.provider?"active":""}" data-srv="${p.id}">${esc(p.name)}</button>`).join("");
}
function card(film){
  const b=document.createElement("button"); b.className="card";
  b.innerHTML=`<div class="poster">${film.poster_path?`<img alt="" src="${IMG}/w342${film.poster_path}">`:""}</div><strong>${esc(film.title)}</strong>`;
  b.onclick=()=>openFilm(film.id); return b;
}
async function paintRail(items, title){
  document.getElementById("shelfTitle").textContent=title;
  const rail=document.getElementById("rail"); rail.innerHTML="";
  items.forEach(f=>rail.appendChild(card(f)));
  if(items[0]){ document.getElementById("heroTitle").textContent=items[0].title; if(items[0].backdrop_path) document.getElementById("heroCard").style.backgroundImage=`url(${IMG}/w780${items[0].backdrop_path})`; document.getElementById("heroCard").onclick=()=>openFilm(items[0].id); }
}
async function loadShelf(mode){
  const map={now_playing:"/movie/now_playing?page=1",popular:"/movie/popular?page=1",top:"/movie/top_rated?page=1",trending:"/trending/movie/week?page=1"};
  const data=await tmdb(map[mode]||map.now_playing);
  paintRail((data.results||[]).filter(x=>x.poster_path), mode.replace("_"," "));
}
async function openFilm(id){
  const film=await tmdb("/movie/"+id);
  S.film=film; S.t=0; S.d=film.runtime?film.runtime*60:0; paintTime();
  document.getElementById("hero").style.display="none";
  document.getElementById("catalog").style.display="none";
  document.getElementById("filters").style.display="none";
  document.getElementById("layout").classList.add("on");
  document.getElementById("meta").innerHTML=`<h2>${esc(film.title)}</h2><span class="chip">${(film.release_date||"").slice(0,4)}</span><span class="chip">${film.runtime||"—"} min</span><span class="chip">${(film.vote_average||0).toFixed(1)}</span><p>${esc(film.overview||"")}</p>`;
  location.hash="#/film/"+id;
  loadFrame();
}
function showCatalog(){ frame.src="about:blank"; document.getElementById("layout").classList.remove("on"); ["hero","catalog","filters"].forEach(id=>document.getElementById(id).style.display=""); history.replaceState(null,"","#/"); }
document.getElementById("servers").onclick=(e)=>{ const b=e.target.closest("[data-srv]"); if(!b) return; S.provider=b.dataset.srv; S.t=0; loadFrame(); };
document.getElementById("playBtn").onclick=toggle;
document.getElementById("bigplay").onclick=toggle;
document.getElementById("shield").onclick=toggle;
document.getElementById("back10").onclick=()=>seekTo(S.t-10);
document.getElementById("fwd10").onclick=()=>seekTo(S.t+10);
document.getElementById("muteBtn").onclick=()=>{ S.muted=!S.muted; command(S.muted?"mute":"unmute"); };
document.getElementById("vol").oninput=(e)=>{ S.vol=e.target.value/100; command("volume", S.vol); };
document.getElementById("rateBtn").onclick=()=>{ S.rate=S.rate>=2?0.75:Math.round((S.rate+0.25)*100)/100; document.getElementById("rateBtn").textContent=S.rate+"x"; command("rate", S.rate); };
document.getElementById("nextSrv").onclick=()=>{ const i=PROVIDERS.findIndex(p=>p.id===S.provider); S.provider=PROVIDERS[(i+1)%PROVIDERS.length].id; loadFrame(); };
document.getElementById("fsBtn").onclick=()=>{ const s=document.getElementById("stage"); document.fullscreenElement?document.exitFullscreen():s.requestFullscreen(); };
document.getElementById("backBtn").onclick=showCatalog;
document.getElementById("home").onclick=(e)=>{ e.preventDefault(); showCatalog(); loadShelf("now_playing"); };
document.getElementById("scrub").addEventListener("input",()=>{ S.seeking=true; if(S.d) document.getElementById("cur").textContent=fmt((document.getElementById("scrub").value/1000)*S.d); });
document.getElementById("scrub").addEventListener("change",()=>{ S.seeking=false; if(S.d) seekTo((document.getElementById("scrub").value/1000)*S.d); });
let qT; document.getElementById("q").oninput=()=>{ clearTimeout(qT); qT=setTimeout(async()=>{ const q=document.getElementById("q").value.trim(); if(!q) return loadShelf("now_playing"); const data=await tmdb("/search/movie?query="+encodeURIComponent(q)); showCatalog(); paintRail((data.results||[]).filter(x=>x.poster_path), "Results"); }, 260); };
window.addEventListener("message",(ev)=>{
  const d=ev.data||{}; const inner=d.data||d.payload||{};
  const event=String(d.event||d.type||inner.event||"").toLowerCase();
  const cur=Number(d.currentTime||inner.currentTime||inner.watched||d.time);
  const dur=Number(d.duration||inner.duration);
  if(dur>1) S.d=dur;
  if(cur>=0 && !Number.isNaN(cur) && !S.seeking) S.t=cur;
  if(event.includes("play")) setPaused(false);
  if(event.includes("pause")) setPaused(true);
  if(event.includes("end")) setPaused(true);
  paintTime();
});
document.addEventListener("keydown",(e)=>{
  if(e.target.matches("input")) return;
  if(e.code==="Space"){ e.preventDefault(); toggle(); }
  if(e.key==="ArrowLeft") seekTo(S.t-10);
  if(e.key==="ArrowRight") seekTo(S.t+10);
  if(e.key==="f") document.getElementById("fsBtn").click();
  if(e.key==="n") document.getElementById("nextSrv").click();
  if(e.key==="m") document.getElementById("muteBtn").click();
});
async function boot(){
  const modes=[["now_playing","Now playing"],["trending","Trending"],["popular","Popular"],["top","Top rated"]];
  modes.forEach(([id,label],i)=>{ const b=document.createElement("button"); b.className="pill"+(i?"":" active"); b.textContent=label; b.onclick=()=>{ document.querySelectorAll("#filters .pill").forEach(x=>x.classList.remove("active")); b.classList.add("active"); loadShelf(id); }; document.getElementById("filters").appendChild(b); });
  renderServers();
  const m=location.hash.match(/film\/(\d+)/);
  if(m) openFilm(m[1]); else loadShelf("now_playing");
}
boot().catch(err=>toast(err.message));
</script>
</body>
</html>
